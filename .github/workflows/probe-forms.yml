name: Probe court forms
on:
  workflow_dispatch:
    inputs:
      forms:
        description: 'id=/sites/default/files/... pairs, space separated'
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install pdf-lib@1.17.1 --no-save
      - run: node scripts/probe-forms.mjs
        env:
          FORMS: ${{ github.event.inputs.forms }}
      - name: Save results to the probe-out branch
        run: |
          mkdir /tmp/po && cp -r probe-out/* /tmp/po/
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git checkout --orphan probe-out-tmp
          git rm -rfq . && rm -rf node_modules probe-out
          cp -r /tmp/po/* .
          git add -A && git commit -qm "probe results"
          git push -f origin HEAD:refs/heads/probe-out
