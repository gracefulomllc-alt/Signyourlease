      tceCorrect.addEventListener('click', () => {
        tceCorrect.classList.add('active'); tceIncorrect.classList.remove('active');
        tceEdit.style.display = 'none';
      });
      tceIncorrect.addEventListener('click', () => {
        tceIncorrect.classList.add('active'); tceCorrect.classList.remove('active');
        tceEdit.style.display = '';
      });
    }

    // ----- Terms toggle -----
    const ltCorrect = document.getElementById('lt-correct');
    const ltIncorrect = document.getElementById('lt-incorrect');
    ltCorrect.addEventListener('click', () => {
      ltCorrect.classList.add('active'); ltIncorrect.classList.remove('active');
      document.getElementById('lt-note').style.display = 'none';
      document.getElementById('lt-flag-row').style.display = 'none';
      state.termsOk = true;
    });
    ltIncorrect.addEventListener('click', () => {
      ltIncorrect.classList.add('active'); ltCorrect.classList.remove('active');
      document.getElementById('lt-note').style.display = '';
      document.getElementById('lt-flag-row').style.display = '';
      state.termsOk = false;
    });

    document.getElementById('btn-flag-problem').addEventListener('click', () => {
      const subject = 'Correction needed on lease — ' + d.propertyAddress;
      const body = 'Hi, before I sign the lease for ' + d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : '') + ', something in the terms needs to be corrected:\n\n[describe what is wrong here]\n\nThanks.';
      const to = d.landlordEmail || '';
      window.location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    });

    document.getElementById('btn-submit-tenant-sign').addEventListener('click', async () => {
      if (!state.nameOk) { alert('Please confirm your name above (Correct or Needs a fix).'); return; }
      if (!state.phoneOk) { alert('Please confirm your phone number above (Correct or Needs a fix).'); return; }
      if (!state.termsOk) { alert('Please confirm the lease terms are correct before signing. If something is wrong, tap "Tell the landlord" so they can send a corrected lease.'); return; }
      if (!d.tenantIdImage && !((window.__pendingUploads || {}).idphoto)) {
        const card = document.getElementById('idphoto-card'); if (card) { card.classList.add('needs'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        alert('Please add a photo of your ID before signing.'); return;
      }
      if (d.assistedBy) {
        const ack = document.getElementById('sig-assist');
        if (!ack || !ack.checked) { if (ack) ack.closest('.checkbox-row').classList.add('needs'); alert('Please check the box confirming you are signing for yourself.'); return; }
        d.assistAcknowledged = true;
      }
      const result = readSignPanel('sig');
      if (!result) return;
      const nm = document.getElementById('tc-name');
      if (nm) d.tenantName = nm.value.trim() || d.tenantName;
      const ph = document.getElementById('tc-phone');
      if (ph) d.tenantPhone = ph.value.trim();
      const em = document.getElementById('tc-email');
      if (em && em.value.trim()) d.tenantEmail = em.value.trim();
      d.tenantSignerName = result.name;
      d.tenantSignedAt = result.signedAt;
      if (result.attested) d.tenantAttested = true;
      if (result.image) d.tenantSignatureImage = result.image;
      const uploads = window.__pendingUploads || {};
      if (uploads.idphoto) d.tenantIdImage = uploads.idphoto;
      if (uploads.paystub) d.tenantPayStubImage = uploads.paystub;
      celebrate();
      await saveAndAdvance(d);
      if (d.landlordSignerName) { goToLease(d); return; }
      renderTenantSentToLandlord(d);
    });
  }

  function renderTenantSentToLandlord(d) {
    const link = baseUrl() + '#lease=' + encodeState(d);
    const subject = 'Ready for your signature — ' + d.propertyAddress;
    const msg = 'I\'ve signed the lease for ' + d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : '') + '. It\'s ready for your signature: ' + link;
    const emailBody = 'Hi,\n\n' + msg.replace('here:', 'here:\n\n');
    const mailtoBack = 'mailto:' + encodeURIComponent(d.landlordEmail || '') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(emailBody);
    const smsBack = d.landlordPhone ? 'sms:' + encodeURIComponent(d.landlordPhone.replace(/[^\d+]/g, '')) + '?body=' + encodeURIComponent(msg) : '';
    const linkTooLong = link.length > 1800;
    app.innerHTML = header(true) + `
      <button class="step-back" id="btn-back-to-tenant-resign">&larr; Re-do my signature</button>
${steps(1, TN_STEPS)}
      <div class="banner banner-success">Signed. If your landlord is here, hand them the device now.</div>
      <p class="hint" style="margin:0.5rem 0 1rem;">Need to get back in later? Go to the lease site, tap <strong>I'm a tenant &rarr; Continue my lease</strong>, and enter your name + the last 4 digits of your cell.</p>
      <div class="card">
        <div class="section-label">Landlord signing in person</div>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn btn-primary" id="btn-go-direct-landlord">Hand device to landlord to sign now</button>
        </div>
      </div>
      <div class="card">
        <div class="section-label">Landlord signing remotely</div>
        <div class="link-box"><code id="landlord-link">${esc(link)}</code></div>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn btn-brass" id="btn-shorten-landlord">Create short link to send</button>
          ${linkTooLong
            ? `<button class="btn" onclick="copyLink('landlord-link')">Copy link</button>`
            : `<a class="btn" href="${mailtoBack}" style="text-decoration:none;display:inline-flex;align-items:center;">Email to landlord</a>
               ${smsBack ? `<button class="btn" id="btn-text-landlord">Text to landlord</button>` : ''}
               <button class="btn" onclick="copyLink('landlord-link')">Copy link</button>`
          }
        </div>
        <p class="hint" style="margin-top:0.75rem;">Tap <strong>Create short link to send</strong> first — it makes a short link that texts and emails reliably.</p>
      </div>
    `;
    document.getElementById('btn-go-direct-landlord').addEventListener('click', () => {
      goToLease(d);
    });
    document.getElementById('btn-shorten-landlord').addEventListener('click', function () { createShortLink(d, 'landlord-link', this); });
    const textLandlordBtn = document.getElementById('btn-text-landlord');
    if (textLandlordBtn) textLandlordBtn.addEventListener('click', () => trySmsOrCopy(smsBack, msg, textLandlordBtn));
    document.getElementById('btn-back-to-tenant-resign').addEventListener('click', () => {
      if (confirm('Clear your signature and sign again?')) {
        delete d.tenantSignerName; delete d.tenantSignedAt; delete d.tenantSignatureImage;
        renderTenantSign(d);
      }
    });
  }

  function attachmentsPageHtml(d) {
    if (!d.tenantIdImage && !d.tenantPayStubImage) return '';
    return `
      <div class="attachments-page">
        <div class="attachments-title">Attachments</div>
        ${d.tenantIdImage ? `<div class="attach-label">Photo ID on file</div><img class="id-thumb" src="${d.tenantIdImage}" alt="Tenant photo ID" style="max-height:320px;margin-bottom:1.5rem;">` : ''}
        ${d.tenantPayStubImage ? `<div class="attach-label">Proof of income on file</div><img class="id-thumb" src="${d.tenantPayStubImage}" alt="Tenant proof of income" style="max-height:320px;">` : ''}
      </div>
    `;
  }

  function renderLandlordSignFromLink(d) {
    app.innerHTML = header() + `
      <button class="step-back" id="btn-back-landlord-sign">&larr; Start this over</button>
${steps(1, TN_STEPS)}
      <div class="banner banner-brass">${esc(d.tenantSignerName)} has signed. Review and sign below.</div>
      <div class="paper" id="lease-paper">${leaseBody(d)}${sigBlockHtml(d)}${attachmentsPageHtml(d)}</div>
      ${signPanelHtml('lsig', 'Sign as landlord')}
      <div class="btn-row no-print">
        <button class="btn btn-brass" id="btn-submit-landlord-sign">Sign &amp; complete lease</button>
      </div>
    `;
    setupSignPanel('lsig');
    document.getElementById('btn-back-landlord-sign').addEventListener('click', () => {
      if (confirm('Start this screen over? Anything you typed here will be cleared.')) {
        renderLandlordSignFromLink(d);
      }
    });
    document.getElementById('btn-submit-landlord-sign').addEventListener('click', async () => {
      const result = readSignPanel('lsig');
      if (!result) return;
      d.landlordSignerName = result.name;
      d.landlordSignedAt = result.signedAt;
      if (result.image) d.landlordSignatureImage = result.image;
      celebrate();
      await saveAndAdvance(d);
      goToLease(d);
    });
  }

  function renderCompleted(d) {
    const link = baseUrl() + '#lease=' + encodeState(d);
    const hasAttachments = !!(d.tenantIdImage || d.tenantPayStubImage);
    app.innerHTML = header() + `
${steps(3, TN_STEPS)}
      <div class="banner banner-success"><span class="seal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span><span>Fully signed. Tenant on ${fmtDateTime(d.tenantSignedAt)}, landlord on ${fmtDateTime(d.landlordSignedAt)}.</span></div>
      <div class="paper" id="lease-paper">${leaseBody(d)}${sigBlockHtml(d)}${attachmentsPageHtml(d)}</div>
      <div class="card no-print" style="margin-top:1.5rem;">
        <div class="section-label">Keep a copy</div>
        <p class="hint" style="margin-bottom:0.75rem;">This link contains the complete signed lease${hasAttachments ? ' and attachments' : ''}. Print it, or download a copy to upload into Innago.</p>
        <div class="link-box"><code id="final-link">${esc(link)}</code></div>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn" onclick="copyLink('final-link')">Copy link</button>
          <button class="btn btn-primary" id="btn-download-pdf">Download PDF</button>
          <button class="btn" onclick="window.print()">Print / Save as PDF</button>
          <button class="btn" id="btn-download-record">Download record</button>
        </div>
      </div>
      <div class="card no-print">
        <div class="section-label">Collected a payment for this lease?</div>
        <p class="hint" style="margin-bottom:0.75rem;">Record what was actually received today — full rent, prorated rent, a deposit, or any mix — as its own receipt.</p>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn" id="btn-new-receipt-for-tenant">New receipt for this tenant</button>
        </div>
      </div>
    `;
    document.getElementById('btn-download-record').addEventListener('click', () => downloadRecord(d));
    document.getElementById('btn-download-pdf').addEventListener('click', function () { downloadLeasePdf(d, this); });
    document.getElementById('btn-new-receipt-for-tenant').addEventListener('click', () => {
      renderReceiptForm({
        propertyAddress: d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : ''),
        tenantName: [d.tenantName, d.tenantName2].filter(Boolean).join(' and '),
        entity: d.entity,
      });
    });
  }

  async function downloadRecord(d) {
    const paper = document.getElementById('lease-paper');
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Signed Lease</title>
      <style>body{font-family:Georgia,serif;max-width:720px;margin:2rem auto;padding:0 1rem;line-height:1.6;}
      h2{text-align:center;} h3{margin-top:1.5rem;} .sig-block{display:flex;gap:2rem;margin-top:2.5rem;}
      .sig-col{flex:1;} .sig-script{font-size:1.6rem;font-style:italic;font-family:Georgia,serif;} .sig-img{max-height:60px;display:block;} .sig-line{border-top:1px solid #333;padding-top:4px;font-size:0.85rem;color:#555;font-family:sans-serif;}
      .attach-label{font-size:0.8rem;color:#666;font-family:sans-serif;margin-top:2rem;} .id-thumb{max-width:320px;border:1px solid #ccc;border-radius:4px;display:block;margin-top:0.5rem;}
      .attachments-page{page-break-before:always;break-before:page;margin-top:2.5rem;padding-top:2rem;border-top:1px dashed #ccc;} .attachments-title{font-size:1.25rem;font-weight:700;text-align:center;margin:0 0 1.5rem;}</style>
      </head><body>${paper.innerHTML}</body></html>`;
    let downloads = null;
    try { downloads = await claude.use('downloads'); } catch (e) {}
    const fname = 'Lease-' + (d.propertyAddress || 'record').replace(/[^a-z0-9]+/gi, '-') + '-signed.html';
    if (downloads) {
      try { await downloads.save({ filename: fname, data: html }); return; } catch (e) {}
    }
    window.print();
  }

  // ---------- RECEIPTS (separate from the lease) ----------
  let receiptRows = [{ label: 'Rent (prorated)', amount: '' }];
  let receiptDraft = null;

  function renderReceiptForm(prefill) {
    const pre = prefill || {};
    app.innerHTML = header() + `
      <button class="step-back" onclick="goHash('#/new');return false;">&larr; Back to lease</button>
      <h1>New receipt</h1>
      <p class="subhead">Record what was actually collected today — full rent, prorated rent, a security deposit, or any mix. This isn't part of the lease; it's its own record.</p>
      <form id="receipt-form">
        <div class="card">
          <div class="section-label">Who and what</div>
          <div class="field-grid">
            <div class="field full">
              <label>Pick a saved property</label>
              <select id="r-property-select">
                <option value="">— Select a property —</option>
                ${PROPERTIES.map((p, i) => `<option value="${i}">${esc(p.label)}</option>`).join('')}
                <option value="__manual__">Other / not listed — type it below</option>
              </select>
            </div>
            <div class="field full"><label>Property address</label><input type="text" id="r-address" value="${esc(pre.propertyAddress)}" placeholder="Type the property address" required></div>
            <div class="field"><label>Tenant name</label><input type="text" id="r-tenant" value="${esc(pre.tenantName)}" placeholder="Full name" required></div>
            <div class="field"><label>Date received</label><input type="date" id="r-date" value="${new Date().toISOString().slice(0,10)}" required></div>
          </div>
          <div class="field-grid">
            <div class="field"><label>Received by</label><input type="text" id="r-receivedby" value="${esc(pre.entity)}" placeholder="Your name or entity"></div>
            <div class="field"><label>Payment method</label>
              <select id="r-method">
                <option>Cash</option><option>Check</option><option>eCheck</option><option>Money Order</option><option>Card</option><option>Other</option>
              </select>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="section-label">What was collected</div>
          <p class="hint" style="margin-bottom:0.75rem;">Add a line for each item — full rent, prorated rent, security deposit, late fee, whatever actually changed hands today.</p>
          <div id="receipt-rows"></div>
          <datalist id="receipt-labels">
            <option value="Rent"><option value="Rent (prorated)"><option value="Rent (partial payment)">
            <option value="Security deposit"><option value="Security deposit installment"><option value="Pet deposit">
            <option value="Late fee"><option value="Returned payment charge"><option value="Storage unit">
            <option value="Utility reimbursement"><option value="Repair charge">
          </datalist>
          <button type="button" class="btn btn-ghost" id="add-receipt-row" style="padding:0.5rem 0.75rem;font-size:0.8125rem;">+ Add another line</button>
        </div>
        <div class="card">
          <div class="section-label">Partial payment</div>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;">
            <input type="checkbox" id="r-partial" style="width:auto;"> This is a partial payment (tenant still owes a balance)
          </label>
          <div id="r-partial-fields" style="display:none;margin-top:0.75rem;">
            <div class="field"><label>Total amount owed for this period</label><input type="number" min="0" step="0.01" id="r-owed" placeholder="805"></div>
            <div class="field"><label>Remaining balance due by (optional)</label><input type="date" id="r-balancedue"></div>
            <div class="field full"><label>What the balance is for (optional)</label><input type="text" id="r-balancefor" placeholder="e.g. November 2026 rent"></div>
            <p class="hint" id="r-balance-preview"></p>
          </div>
        </div>
        <div class="card">
          <div class="section-label">Acknowledgment</div>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;margin-bottom:0.5rem;">
            <input type="checkbox" id="r-tenantsign" style="width:auto;"> Tenant signs to acknowledge receipt
          </label>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;">
            <input type="checkbox" id="r-landlordsign" style="width:auto;"> Landlord signs
          </label>
          <p class="hint" style="margin-top:0.5rem;">Leave both unchecked for a plain printed receipt with typed names only.</p>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary">Review receipt &rarr;</button>
        </div>
      </form>
    `;
    document.getElementById('r-property-select').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === '' ) return;
      if (val === '__manual__') { document.getElementById('r-address').focus(); return; }
      const match = PROPERTIES[parseInt(val, 10)];
      if (!match) return;
      document.getElementById('r-address').value = match.unit ? match.street + ', ' + match.unit + ', ' + match.cityZip : match.street + ', ' + match.cityZip;
    });
    let rows = [{ label: 'Rent (prorated)', amount: '' }];
    function renderRows() {
      const wrap = document.getElementById('receipt-rows');
      wrap.innerHTML = rows.map((row, i) => `
        <div class="deposit-row" data-idx="${i}" style="grid-template-columns:1.6fr 1fr auto;">
          <input type="text" list="receipt-labels" placeholder="Label (e.g. Rent, Security deposit)" value="${esc(row.label)}" data-field="label">
          <input type="number" min="0" step="1" placeholder="Amount" value="${esc(row.amount)}" data-field="amount">
          <button type="button" class="row-remove" title="Remove" ${rows.length===1?'disabled style="visibility:hidden;"':''}>&times;</button>
        </div>
      `).join('') + `<div class="deposit-total">Total collected: ${fmtMoney(rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0))}</div>`;
      wrap.querySelectorAll('.deposit-row').forEach(rowEl => {
        const idx = parseInt(rowEl.dataset.idx, 10);
        rowEl.querySelectorAll('[data-field]').forEach(input => {
          input.addEventListener('input', () => {
            rows[idx][input.dataset.field] = input.value;
            wrap.querySelector('.deposit-total').textContent = 'Total collected: ' + fmtMoney(rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0));
          });
        });
        rowEl.querySelector('.row-remove').addEventListener('click', () => {
          if (rows.length === 1) return;
          rows.splice(idx, 1);
          renderRows();
        });
      });
    }
    renderRows();
    document.getElementById('add-receipt-row').addEventListener('click', () => {
      rows.push({ label: '', amount: '' });
      renderRows();
    });
    const partialBox = document.getElementById('r-partial');
    const refreshBalance = () => {
      const owed = parseFloat(document.getElementById('r-owed').value) || 0;
      const paid = rows.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
      const prev = document.getElementById('r-balance-preview');
      if (!owed) { prev.textContent = 'Enter the total owed to see the remaining balance.'; return; }
      const bal = Math.round((owed - paid) * 100) / 100;
      prev.textContent = bal > 0 ? 'Paid ' + fmtMoney(paid) + ' of ' + fmtMoney(owed) + '. Remaining balance: ' + fmtMoney(bal) + '.'
        : 'Paid ' + fmtMoney(paid) + ' covers the full ' + fmtMoney(owed) + '. Uncheck "partial payment" if nothing is still owed.';
    };
    partialBox.addEventListener('change', () => { document.getElementById('r-partial-fields').style.display = partialBox.checked ? '' : 'none'; refreshBalance(); });
    document.getElementById('r-owed').addEventListener('input', refreshBalance);
    document.getElementById('receipt-rows').addEventListener('input', refreshBalance);
    document.getElementById('receipt-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const items = rows.filter(r => r.label.trim() !== '' && parseFloat(r.amount) > 0).map(r => ({ label: r.label.trim(), amount: r.amount }));
      if (items.length === 0) { alert('Add at least one line with an amount.'); return; }
      let partial = null;
      if (partialBox.checked) {
        const owed = parseFloat(document.getElementById('r-owed').value) || 0;
        const paid = items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
        if (!owed) { alert('Enter the total amount owed, or uncheck "partial payment."'); return; }
        if (owed <= paid) { alert('The amount paid covers everything owed. Uncheck "partial payment," or fix the total owed.'); return; }
        partial = { owed: owed, balance: Math.round((owed - paid) * 100) / 100,
          dueBy: document.getElementById('r-balancedue').value, forWhat: document.getElementById('r-balancefor').value.trim() };
      }
      receiptDraft = {
        propertyAddress: document.getElementById('r-address').value.trim(),
        tenantName: document.getElementById('r-tenant').value.trim(),
        dateReceived: document.getElementById('r-date').value,
        receivedBy: document.getElementById('r-receivedby').value.trim(),
        method: document.getElementById('r-method').value,
        items: items,
        partial: partial,
        needsTenantSign: document.getElementById('r-tenantsign').checked,
        needsLandlordSign: document.getElementById('r-landlordsign').checked,
      };
      renderReceiptReview(receiptDraft);
    });
  }

  function receiptBody(d) {
    const total = d.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
    return `
      <h2>Receipt of Payment</h2>
      <p style="text-align:center;color:var(--slate);font-family:'Inter',sans-serif;font-size:0.8125rem;margin-top:-1rem;">${fmtDate(d.dateReceived)}</p>
      <p><strong>Property:</strong> ${esc(d.propertyAddress)}<br>
      <strong>Tenant:</strong> ${esc(d.tenantName)}<br>
      <strong>Payment method:</strong> ${esc(d.method)}</p>
      <table style="width:100%;border-collapse:collapse;margin:1.5rem 0;">
        ${d.items.map(it => `<tr><td style="padding:0.4rem 0;border-bottom:1px solid var(--paper-line);">${esc(it.label)}</td><td style="padding:0.4rem 0;border-bottom:1px solid var(--paper-line);text-align:right;">${fmtMoney(it.amount)}</td></tr>`).join('')}
        <tr><td style="padding:0.6rem 0;font-weight:600;">Total received</td><td style="padding:0.6rem 0;font-weight:600;text-align:right;">${fmtMoney(total)}</td></tr>
        ${d.partial ? `<tr><td style="padding:0.4rem 0;">Total owed${d.partial.forWhat ? ' (' + esc(d.partial.forWhat) + ')' : ''}</td><td style="padding:0.4rem 0;text-align:right;">${fmtMoney(d.partial.owed)}</td></tr>
        <tr><td style="padding:0.6rem 0;font-weight:600;color:#b3261e;">Remaining balance${d.partial.dueBy ? ', due by ' + fmtDate(d.partial.dueBy) : ''}</td><td style="padding:0.6rem 0;font-weight:600;text-align:right;color:#b3261e;">${fmtMoney(d.partial.balance)}</td></tr>` : ''}
      </table>
      ${d.partial ? `<p style="font-size:0.85rem;"><strong>Partial payment.</strong> This receipt acknowledges a partial payment only. A balance of ${fmtMoney(d.partial.balance)} remains owed${d.partial.dueBy ? ' and is due by ' + fmtDate(d.partial.dueBy) : ''}. As provided in the lease, the Landlord's acceptance of a partial payment does not waive the remaining balance or any of the Landlord's rights or remedies under the lease or Colorado law.</p>` : ''}
      <p style="font-family:'Inter',sans-serif;font-size:0.8125rem;color:var(--slate);">Received by: ${esc(d.receivedBy || 'Landlord')}</p>
    `;
  }

  function receiptSigBlockHtml(d) {
    if (!d.needsTenantSign && !d.needsLandlordSign) return '';
    const cols = [];
    if (d.needsLandlordSign) cols.push(`
      <div class="sig-col">
        ${d.landlordSignatureImage ? `<img class="sig-img" src="${d.landlordSignatureImage}" style="max-height:55px;display:block;">` : `<div class="sig-script">${esc(d.landlordSignerName || '')}</div>`}
        <div class="sig-line"><strong>${esc(d.receivedBy || 'Landlord')}</strong>${d.landlordSignedAt ? ' &middot; ' + fmtDateTime(d.landlordSignedAt) : ''}</div>
      </div>`);
    if (d.needsTenantSign) cols.push(`
      <div class="sig-col">
        ${d.tenantSignatureImage ? `<img class="sig-img" src="${d.tenantSignatureImage}" style="max-height:55px;display:block;">` : `<div class="sig-script">${esc(d.tenantSignerName || '')}</div>`}
        <div class="sig-line"><strong>${esc(d.tenantName)}</strong>${d.tenantSignedAt ? ' &middot; ' + fmtDateTime(d.tenantSignedAt) : ''}</div>
      </div>`);
    return `<div class="sig-block">${cols.join('')}</div>`;
  }

  function renderReceiptReview(d) {
    const needsAnySign = d.needsTenantSign || d.needsLandlordSign;
    app.innerHTML = header() + `
      <button class="step-back" onclick="renderReceiptForm(receiptDraft)">&larr; Edit</button>
      <div class="paper" id="receipt-paper">${receiptBody(d)}</div>
      ${d.needsLandlordSign ? signPanelHtml('rlsig', 'Landlord signature') : ''}
      ${d.needsTenantSign ? signPanelHtml('rtsig', 'Tenant signature') : ''}
      <div class="btn-row no-print">
        <button class="btn btn-brass" id="btn-finish-receipt">${needsAnySign ? 'Sign & finish receipt' : 'Finish receipt'}</button>
      </div>
    `;
    if (d.needsLandlordSign) setupSignPanel('rlsig');
    if (d.needsTenantSign) setupSignPanel('rtsig');
    document.getElementById('btn-finish-receipt').addEventListener('click', () => {
      if (d.needsLandlordSign) {
        const r = readSignPanel('rlsig');
        if (!r) return;
        d.landlordSignerName = r.name; d.landlordSignedAt = r.signedAt;
        if (r.image) d.landlordSignatureImage = r.image;
      }
      if (d.needsTenantSign) {
        const r = readSignPanel('rtsig');
        if (!r) return;
        d.tenantSignerName = r.name; d.tenantSignedAt = r.signedAt;
        if (r.attested) d.tenantAttested = true;
        if (r.image) d.tenantSignatureImage = r.image;
      }
      if (d.needsTenantSign || d.needsLandlordSign) celebrate();
      location.hash = '#receipt=' + encodeState(d);
    });
  }

  // ---------- SAVED RECEIPTS ----------
  async function saveReceiptToServer(d) {
    const clean = { ...d }; delete clean._id;
    const r = await fetch('/api/receipts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save', key: staffKey(), receipt: clean }) });
    if (!r.ok) throw new Error('save failed');
    return (await r.json()).id;
  }
  function receiptPdfHtml(d) {
    const total = d.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
    let h = '<h2>Receipt of Payment</h2><p>' + esc(fmtDate(d.dateReceived)) + '</p>';
    h += '<p><strong>Property:</strong> ' + esc(d.propertyAddress) + '</p><p><strong>Tenant:</strong> ' + esc(d.tenantName) + '</p><p><strong>Payment method:</strong> ' + esc(d.method) + '</p>';
    d.items.forEach(it => { h += '<p>' + esc(it.label) + ': ' + fmtMoney(it.amount) + '</p>'; });
    h += '<p><strong>Total received: ' + fmtMoney(total) + '</strong></p>';
    if (d.partial) {
      h += '<p>Total owed' + (d.partial.forWhat ? ' (' + esc(d.partial.forWhat) + ')' : '') + ': ' + fmtMoney(d.partial.owed) + '</p>';
      h += '<p><strong>Remaining balance' + (d.partial.dueBy ? ', due by ' + esc(fmtDate(d.partial.dueBy)) : '') + ': ' + fmtMoney(d.partial.balance) + '</strong></p>';
      h += '<p><strong>Partial payment.</strong> This receipt acknowledges a partial payment only. A balance of ' + fmtMoney(d.partial.balance) + ' remains owed' + (d.partial.dueBy ? ' and is due by ' + esc(fmtDate(d.partial.dueBy)) : '') + '. As provided in the lease, the Landlord\'s acceptance of a partial payment does not waive the remaining balance or any of the Landlord\'s rights or remedies under the lease or Colorado law.</p>';
    }
    h += '<p>Received by: ' + esc(d.receivedBy || 'Landlord') + '</p>';
    if (d.needsLandlordSign && d.landlordSignedAt) h += '<p>Signed electronically by ' + esc(d.landlordSignerName || d.receivedBy || 'Landlord') + ' on ' + esc(fmtDateTime(d.landlordSignedAt)) + '.</p>';
    if (d.needsTenantSign && d.tenantSignedAt) h += '<p>Signed electronically by ' + esc(d.tenantSignerName || d.tenantName) + ' (Tenant) on ' + esc(fmtDateTime(d.tenantSignedAt)) + '.</p>';
    return h;
  }
  function receiptFileName(d) { return 'Receipt - ' + (d.tenantName || 'Tenant') + ' - ' + (d.propertyAddress || '') + ' - ' + (d.dateReceived || '') + '.pdf'; }

  async function renderReceipts() {
    app.innerHTML = header() + `<p class="hint" style="text-align:center;padding:2rem 0;">Loading receipts&hellip;</p>`;
    let items = [];
    try { const r = await fetch('/api/receipts?key=' + encodeURIComponent(staffKey())); if (!r.ok) throw 0; items = (await r.json()).items || []; }
    catch (e) { app.innerHTML = header() + `<div class="banner banner-brass">Could not load receipts. Check your connection and try again.</div>`; return; }
    window.__receipts = items;
    // one group per property, newest receipt first inside each
    const groups = {};
    items.forEach(it => { const key = (it.property || 'No address').replace(/\s+/g, ' ').trim(); const k = key.toLowerCase(); (groups[k] = groups[k] || { name: key, list: [] }).list.push(it); });
    const order = Object.values(groups).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    order.forEach(g => g.list.sort((a, b) => (b.dateReceived || '').localeCompare(a.dateReceived || '') || (b.savedAt || 0) - (a.savedAt || 0)));
    const row = (it) => `
      <div style="display:flex;justify-content:space-between;gap:0.75rem;align-items:center;padding:0.7rem 0;border-top:1px solid #F1E4D8;flex-wrap:wrap;">
        <div style="min-width:0;flex:1;">
          <strong>${esc(it.tenant || 'Tenant')}</strong> &middot; ${fmtMoney(it.total)}${it.balance ? ` <span style="color:#A0352C;font-size:0.85rem;font-weight:600;">(${fmtMoney(it.balance)} still owed)</span>` : ''}<br>
          <span style="font-size:0.85rem;color:var(--ink-soft);">${esc(fmtDate(it.dateReceived))}${it.items ? ' &middot; ' + esc(it.items) : ''}${it.method ? ' &middot; ' + esc(it.method) : ''}</span>
        </div>
        <div class="btn-row" style="margin:0;">
          <button class="btn btn-ghost" style="padding:0.4rem 0.8rem;font-size:0.85rem;" onclick="openReceipt('${esc(it.id)}', this)">Open</button>
          <button class="btn btn-ghost" style="padding:0.4rem 0.8rem;font-size:0.85rem;" onclick="receiptPdf('${esc(it.id)}', this)">PDF</button>
        </div>
      </div>`;
    app.innerHTML = header() + `
      <div style="max-width:720px;margin:1rem auto;">
        <h1 style="text-align:center;margin-bottom:0.4rem;">Receipts</h1>
        <p class="subhead" style="text-align:center;margin:0 auto 1rem;">Grouped by property. Tap a property to see every receipt for it, newest first.</p>
        ${order.length ? order.map((g, gi) => {
          const total = g.list.reduce((s, it) => s + (it.total || 0), 0);
          return `<details class="card" style="padding:0;" ${order.length === 1 ? 'open' : ''}>
            <summary style="cursor:pointer;list-style:none;padding:1rem 1.25rem;display:flex;justify-content:space-between;gap:0.75rem;align-items:center;flex-wrap:wrap;">
              <span><strong style="font-size:1.05rem;">${esc(g.name)}</strong><br><span style="font-size:0.85rem;color:var(--ink-soft);">${g.list.length} receipt${g.list.length === 1 ? '' : 's'} &middot; ${fmtMoney(total)} received &middot; latest ${esc(fmtDate(g.list[0].dateReceived))}</span></span>
              <span class="btn btn-ghost" style="padding:0.35rem 0.8rem;font-size:0.85rem;">Show</span>
            </summary>
            <div style="padding:0 1.25rem 0.5rem;">${g.list.map(row).join('')}</div>
          </details>`; }).join('') : `<div class="card"><p class="hint" style="margin:0;">No saved receipts yet. Receipts you finish from now on show up here. To add an older receipt, open its emailed link while signed in on this device.</p></div>`}
        <div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" onclick="goHash('#/receipt')">Create a new receipt</button></div>
      </div>`;
    app.querySelectorAll('details.card').forEach(dt => dt.addEventListener('toggle', () => { const b = dt.querySelector('summary .btn'); if (b) b.textContent = dt.open ? 'Hide' : 'Show'; }));
    app.querySelectorAll('details.card[open] summary .btn').forEach(b => { b.textContent = 'Hide'; });
    window.scrollTo(0, 0);
  }
  async function fetchReceipt(id) {
    const r = await fetch('/api/receipts?id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(staffKey()));
    if (!r.ok) throw new Error('not found');
    return r.json();
  }
  window.openReceipt = async function (id, btn) {
    if (btn) { btn.disabled = true; btn.textContent = 'Opening…'; }
    try { const d = await fetchReceipt(id); renderSavedReceipt(d); }
    catch (e) { if (btn) { btn.disabled = false; btn.textContent = 'Open'; } alert('Could not open that receipt. Try again.'); }
  };
  window.receiptPdf = async function (id, btn) {
    const orig = btn.textContent; btn.disabled = true; btn.textContent = '…';
    try { const d = await fetchReceipt(id); btn.disabled = false; btn.textContent = orig; await downloadDocPdf(receiptPdfHtml(d), receiptFileName(d), 'Receipt: ' + (d.propertyAddress || ''), 'Receipt - ' + (d.tenantName || ''), btn); }
    catch (e) { btn.disabled = false; btn.textContent = orig; alert('Could not load that receipt. Try again.'); }
  };
  function renderSavedReceipt(d) {
    const total = d.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
    const link = baseUrl() + '#receipt=' + encodeState(Object.assign({}, d, { _id: undefined }));
    const mailto = 'mailto:?subject=' + encodeURIComponent('Receipt — ' + d.propertyAddress) + '&body=' + encodeURIComponent('Receipt for ' + fmtMoney(total) + ' received ' + fmtDate(d.dateReceived) + ' for ' + d.propertyAddress + ': ' + link);
    app.innerHTML = header() + `
      <button class="step-back" onclick="goHash('#/receipts')">&larr; All receipts</button>
      <div class="paper" id="receipt-paper">${receiptBody(d)}${receiptSigBlockHtml(d)}</div>
      <div class="card no-print" style="margin-top:1.5rem;">
        <div class="btn-row" style="margin-top:0;flex-wrap:wrap;">
          <button class="btn btn-primary" id="sr-pdf">Download PDF</button>
          <button class="btn" onclick="window.print()">Print</button>
          <a class="btn btn-brass" href="${mailto}" style="text-decoration:none;display:inline-flex;align-items:center;">Email a copy</a>
          <button class="btn btn-ghost" style="color:#A8372D;" id="sr-del">Delete receipt</button>
        </div>
      </div>`;
    document.getElementById('sr-pdf').addEventListener('click', function () { downloadDocPdf(receiptPdfHtml(d), receiptFileName(d), 'Receipt: ' + (d.propertyAddress || ''), 'Receipt - ' + (d.tenantName || ''), this); });
    document.getElementById('sr-del').addEventListener('click', async function () {
      if (this.dataset.confirm !== '1') { this.dataset.confirm = '1'; this.textContent = 'Tap again to delete permanently'; return; }
      this.disabled = true;
      try { await fetch('/api/receipts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete', id: d._id, key: staffKey() }) }); goHash('#/receipts'); }
      catch (e) { this.disabled = false; alert('Could not delete. Try again.'); }
    });
    window.scrollTo(0, 0);
  }

  function renderReceiptFinal(d) {
    const link = baseUrl() + '#receipt=' + encodeState(d);
    const subject = 'Receipt — ' + d.propertyAddress;
    const total = d.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
    const msg = 'Receipt for ' + fmtMoney(total) + ' received ' + fmtDate(d.dateReceived) + ' for ' + d.propertyAddress + ': ' + link;
    const mailto = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(msg);
    app.innerHTML = header() + `
      <div class="banner banner-success">Receipt recorded — ${fmtMoney(total)} on ${fmtDate(d.dateReceived)}.${landlordAuthed() ? ' <span id="rc-saved">Saving to Receipts…</span>' : ''}</div>
      <div class="paper" id="receipt-paper">${receiptBody(d)}${receiptSigBlockHtml(d)}</div>
      <div class="card no-print" style="margin-top:1.5rem;">
        <div class="section-label">Keep a copy</div>
        <div class="btn-row" style="margin-top:0;">
          <a class="btn btn-brass" href="${mailto}" style="text-decoration:none;display:inline-flex;align-items:center;">Email a copy</a>
          <button class="btn btn-primary" onclick="window.print()">Print / save as PDF</button>
          <button class="btn" id="btn-download-receipt">Download PDF</button>
        </div>
      </div>
    `;
    document.getElementById('btn-download-receipt').addEventListener('click', function () { downloadDocPdf(receiptPdfHtml(d), receiptFileName(d), 'Receipt: ' + (d.propertyAddress || ''), 'Receipt - ' + (d.tenantName || ''), this); });
    if (landlordAuthed()) saveReceiptToServer(d).then(() => { const s = document.getElementById('rc-saved'); if (s) s.innerHTML = 'Saved in <a href="#/receipts">Receipts</a>.'; })
      .catch(() => { const s = document.getElementById('rc-saved'); if (s) s.innerHTML = '<strong>Not saved to Receipts</strong> (connection problem). Reload this page to try again.'; });
  }

  async function downloadReceipt(d) {
    const paper = document.getElementById('receipt-paper');
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt</title>
      <style>body{font-family:Georgia,serif;max-width:600px;margin:2rem auto;padding:0 1rem;line-height:1.6;}
      h2{text-align:center;} .sig-block{display:flex;gap:2rem;margin-top:2.5rem;} .sig-col{flex:1;}
      .sig-script{font-size:1.6rem;font-style:italic;} .sig-img{max-height:55px;display:block;} .sig-line{border-top:1px solid #333;padding-top:4px;font-size:0.85rem;color:#555;font-family:sans-serif;}</style>
      </head><body>${paper.innerHTML}</body></html>`;
    let downloads = null;
    try { downloads = await claude.use('downloads'); } catch (e) {}
    const fname = 'Receipt-' + (d.propertyAddress || 'record').replace(/[^a-z0-9]+/gi, '-') + '-' + d.dateReceived + '.html';
    if (downloads) {
      try { await downloads.save({ filename: fname, data: html }); return; } catch (e) {}
    }
    window.print();
  }
})();
</script>
</body>
</html>
