      return esc(dep.label) + ': ' + fmtMoney(dep.amount) + (dep.status === 'carried' ? ' (already held)' : dep.status === 'nonrefundable' ? ' (non-refundable fee)' : ' (due at signing)');
    }).join('<br>') || 'None';
    app.innerHTML = header() + `
      <button class="step-back" onclick="editDraft()">&larr; Go back and fix</button>
${steps(1, LL_STEPS)}
      <h1>Check before sending</h1>
      <div class="card" style="border-left:4px solid ${errors.length ? '#b3261e' : warns.length ? '#a8803c' : 'green'};">
        ${clean ? `<p style="color:green;margin:0;"><strong>&#10003; Everything checks out.</strong> Give the summary below one last look.</p>` : `
          <div class="section-label">${errors.length ? errors.length + ' problem' + (errors.length === 1 ? '' : 's') : ''}${errors.length && warns.length ? ' &middot; ' : ''}${warns.length ? warns.length + ' thing' + (warns.length === 1 ? '' : 's') + ' to double-check' : ''}</div>
          <ul style="padding:0;margin:0.5rem 0 0;">${list(errors, '#b3261e', '&#10007;')}${list(warns, '#8a6d1a', '!')}</ul>`}
        ${notes.length ? `<ul style="padding:0;margin:0.75rem 0 0;">${list(notes, 'inherit', '&#8226;')}</ul>` : ''}
      </div>
      <div class="card">
        <div class="section-label">Summary</div>
        ${row('Tenant', esc([d.tenantName, d.tenantName2].filter(Boolean).join(' and ') || '—'))}
        ${row('Phone', esc(d.tenantPhone || '—') + (digits.length >= 4 ? ' &middot; access code <strong>' + digits.slice(-4) + '</strong>' : ''))}
        ${row('Email', esc(d.tenantEmail || '—'))}
        ${row('Property', esc(d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : '') + (d.cityZip ? ', ' + d.cityZip : '')))}
        ${row('Landlord', esc(d.entity || '—'))}
        ${row('Term', d.termType === 'mtm' ? 'Month-to-month from ' + fmtDate(d.startDate) : fmtDate(d.startDate) + ' to ' + fmtDate(d.endDate))}
        ${row('Monthly rent', fmtMoney(rent + petTotal) + (petTotal ? ' (includes ' + fmtMoney(petTotal) + ' pet rent)' : '') + ', due the ' + (parseInt(d.dueDay, 10) || 1) + ordinalSuffix(parseInt(d.dueDay, 10) || 1))}
        ${row('First month', fmtMoney(firstMonth) + (d.prorateFirst && d.prorate && d.prorate.amount ? ' (prorated, ' + d.prorate.remaining + ' of ' + d.prorate.daysInMonth + ' days)' : ''))}
        ${row('Deposits', deposits)}
        ${row('Deposit due at signing', fmtMoney(depAtSigning))}
        ${row('Utilities', d.utilMode === 'included' ? 'Included (flat fee in rent)' : d.utilMode === 'landlord' ? 'Landlord pays' : 'Tenant pays')}
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="editDraft()">&larr; Go back and fix</button>
        <button class="btn ${errors.length ? 'btn-brass' : 'btn-primary'}" id="review-continue">${clean ? 'Looks right, continue' : 'Send anyway'}</button>
      </div>`;
    window.scrollTo(0, 0);
    document.getElementById('review-continue').addEventListener('click', () => renderSendToTenant(d));
  }

  // ---------- LEASE TEXT ----------
  function leaseBody(d) {
    const landlordName = d.entity || 'Landlord';
    const tenants = [d.tenantName, d.tenantName2].filter(Boolean).join(' and ');
    const propLine = d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : '') + ', ' + d.cityZip;
    const rentText = fmtMoney(d.rent);
    let rentClause;
    if (d.hasPetRent && parseFloat(d.petRentAmount) > 0) {
      const per = parseFloat(d.petRentAmount) || 0;
      const count = parseInt(d.petCount) || 0;
      const petTotal = per * count;
      const totalRent = (parseFloat(d.rent) || 0) + petTotal;
      rentClause = `The Tenant agrees to pay to the Landlord as rent for the use and occupancy of the Leased Property the sum of ${rentText} per month, plus pet rent of ${fmtMoney(per)} per pet per month for ${count} pet${count === 1 ? '' : 's'} (${fmtMoney(petTotal)} per month), for a total monthly Rent of ${fmtMoney(totalRent)}, due on the ${esc(String(d.dueDay||1))}${ordinalSuffix(d.dueDay||1)} day of each month ("Rent"). Pet rent adjusts if the number of pets on the Leased Property changes, subject to the Landlord's written approval of any new pet. Pet rent and any pet deposit under this Lease are intended to comply with, and shall be limited to, the maximum amounts permitted by C.R.S. § 38-12-106.`;
    } else {
      rentClause = `The Tenant agrees to pay to the Landlord as rent for the use and occupancy of the Leased Property the sum of ${rentText} due on the ${esc(String(d.dueDay||1))}${ordinalSuffix(d.dueDay||1)} day of each month ("Rent").`;
    }
    if (d.prorateFirst && d.prorate && d.prorate.amount) {
      rentClause += ` Because the Start Date falls after the first day of the month, Rent for the first partial month, covering ${fmtDate(d.startDate)} through ${fmtDate(d.prorate.periodEnd)} (${d.prorate.remaining} of ${d.prorate.daysInMonth} days), is prorated to ${fmtMoney(d.prorate.amount)} and is due on or before the Start Date. The full monthly Rent is due beginning on the first day of the following month and on the regular due date each month thereafter.`;
    }
    let termParagraph;
    if (d.termType === 'mtm') {
      termParagraph = `This Lease is a month-to-month tenancy, starting on ${fmtDate(d.startDate)} ("Start Date"). Either party may terminate this tenancy by providing written notice in accordance with Colorado law.`;
    } else {
      termParagraph = `This Lease shall be for a fixed term, starting on ${fmtDate(d.startDate)} ("Start Date") and ending on ${fmtDate(d.endDate)} ("Termination Date"). The Tenant will be entitled to possession of the Leased Property beginning on the Start Date and shall maintain possession until the Termination Date unless terminated through approved methods outlined in this Lease or under Colorado law. `;
    }
    let depositParagraph;
    const deposits = Array.isArray(d.deposits) ? d.deposits : [];
    if (deposits.length === 0) {
      depositParagraph = `No security deposit or additional fees are required under this Lease.`;
    } else {
      const lines = deposits.map(dep => {
        const amt = fmtMoney(dep.amount);
        if (dep.status === 'plan') {
          const down = parseFloat(dep.down) || 0;
          const planRows = Array.isArray(dep.plan) ? dep.plan : [];
          const sched = [];
          if (down > 0) sched.push(`${fmtMoney(down)} due at signing`);
          planRows.forEach(p => sched.push(`${fmtMoney(p.amount)} due on or before ${fmtDate(p.date)}`));
          const schedText = sched.length ? sched.join('; ') : 'according to the schedule agreed in writing';
          return `The Tenant shall pay to the Landlord, in trust, a ${esc(dep.label)} totaling ${amt}, payable in installments as follows: ${schedText}. Each installment is held as part of the security deposit as it is received, and all protections and obligations relating to the security deposit under this Lease and Colorado law apply to amounts actually received. The Tenant's agreement to this installment schedule is a material term of this Lease, and the full ${amt} remains owed regardless of the schedule. Failure to pay any installment in full within seven (7) days after its scheduled date is a material violation of this Lease, separate and distinct from nonpayment of Rent, entitling the Landlord to the remedies available under this Lease and Colorado law. Deposit installments are not Rent, shall not be applied to Rent, and the deposit may not be applied by the Tenant toward any month's Rent.`;
        } else if (dep.status === 'carried') {
          return `The Tenant previously paid, and the Landlord continues to hold in trust, a ${esc(dep.label)} of ${amt} for the Leased Property. This carries forward and continues to be held under this Lease.`;
        } else if (dep.status === 'nonrefundable') {
          return `The Tenant shall pay a ${esc(dep.label)} of ${amt}. This fee is non-refundable and is not held as a security deposit.`;
        }
        return `At the time of signing this Lease, the Tenant shall pay to the Landlord, in trust, a ${esc(dep.label)} of ${amt}, to be held and disbursed for the Tenant's damages to the Leased Property or other defaults under this Lease, as provided by law.`;
      });
      const refundable = deposits.filter(dep => dep.status !== 'nonrefundable');
      const total = deposits.reduce((s, dep) => s + (parseFloat(dep.amount) || 0), 0);
      depositParagraph = lines.map(l => '<span style="display:block;margin-bottom:0.6rem;">' + l + '</span>').join('');
      const dueAtSigning = deposits.reduce((s, dep) => s + (dep.status === 'plan' ? (parseFloat(dep.down) || 0) : dep.status === 'carried' ? 0 : (parseFloat(dep.amount) || 0)), 0);
      if (deposits.length > 1 || deposits.some(dep => dep.status === 'plan')) depositParagraph += `<span style="display:block;margin-bottom:0.6rem;">Total under this section: ${fmtMoney(total)}. Amount due at signing: ${fmtMoney(dueAtSigning)}.</span>`;
      if (refundable.length > 0) {
        depositParagraph += ` The Landlord shall, within thirty (30) days after the termination of this Lease or surrender and acceptance of the premises, whichever occurs last, return to the Tenant any refundable deposit, less lawful deductions, together with a written statement listing the exact reasons for any amount retained. In accordance with Colorado law, no refundable deposit shall be retained to cover normal wear and tear or any damage or defect that existed before the tenancy began, and deductions are limited to unpaid Rent, unpaid utility charges lawfully owed under this Lease, other lawful charges identified in this Lease, and the documented cost of repairing damage beyond normal wear and tear caused during the tenancy. The deposit is security for the Tenant's performance and may not be applied by the Tenant as payment of the last month's Rent or any other Rent.`;
      }
    }
    const supersedeParagraph = d.supersede
      ? `<p>This Lease supersedes and replaces in full any prior lease agreement${d.priorTerm ? ' (Term: ' + esc(d.priorTerm) + ')' : ''} between Landlord and Tenant for the Leased Property. Upon execution of this Lease, the prior lease agreement is terminated and of no further force or effect.</p>`
      : '';
    return `
      <h2>Colorado Lease Agreement</h2>
      <p>This Lease Agreement ("Lease") is entered into on ${fmtDate(d.createdDate)}, by and between ${esc(landlordName)} ("Landlord")${d.agent ? ', by and through its managing agent ' + esc(d.agent) : ''}, and ${esc(tenants || 'Tenant')} ("Tenant").</p>
      ${supersedeParagraph}
      <h3>Leased Property</h3><p>The Landlord hereby leases to the Tenant the property located at ${esc(propLine)} ("Leased Property").</p>
      <h3>Term</h3><p>${termParagraph}</p>
      ${d.termType !== 'mtm' ? `<h3>Lease Expiration — Automatic Month-to-Month Continuation</h3><p>If this Lease reaches its Termination Date and neither party has ended the tenancy — that is, the Landlord has not served a lawful non-renewal or other notice permitted under Colorado law, and the Tenant has not given written notice of non-renewal at least thirty (30) days before the Termination Date — this tenancy does not end. It automatically continues as a month-to-month tenancy on the same terms and conditions contained in this Lease, including the same Rent, deposits held, rules, and all other provisions, until either party ends it with the written notice required by Colorado law. Rent for any continuation period may be adjusted only as permitted by Colorado law, with the required advance written notice. An expired Termination Date is not, by itself, grounds to treat the Tenant as holding over while this month-to-month continuation is in effect.</p>` : ''}
      <h3>Rent</h3><p>${rentClause}</p>
      <h3>Security Deposit and Fees</h3><p>${depositParagraph}</p>
      <h3>Move-In Condition Report</h3><p>At or before move-in, the Landlord will document the condition of the Leased Property with a written checklist and/or dated photographs and provide a copy to the Tenant. The Tenant shall have seven (7) days after the Start Date to deliver to the Landlord, in writing, any claimed discrepancies or pre-existing damage not reflected in the Landlord's documentation. If no timely written discrepancies are delivered, the parties agree that the Landlord's documentation accurately reflects the condition of the Leased Property at move-in and shall be the baseline for assessing damage at move-out.</p>
      <h3>Damage, Repairs, and Duty to Report</h3><p>The Tenant shall promptly notify the Landlord in writing of any damage, leak, pest activity, moisture or mold condition, or needed repair. The Tenant shall be responsible for the documented, actual cost of repairing damage to the Leased Property beyond normal wear and tear caused by the Tenant, the Tenant's occupants, guests, or pets, including damage made worse by the Tenant's failure to report it promptly. Repair charges are due as other lawful charges under this Lease within fifteen (15) days of the Landlord's written invoice with supporting documentation.</p>
      <h3>Condition at Move-Out</h3><p>At move-out, the Tenant shall return the Leased Property in the same condition as at move-in, normal wear and tear excepted, swept and cleaned, with all trash and personal property removed and all keys and access devices returned. The documented, actual cost of cleaning beyond normal wear and tear, trash removal, and key or lock replacement may be deducted from the security deposit or charged to the Tenant as permitted by law.</p>
      <h3>Late Fee</h3><p>${esc(d.lateFee)}</p>
      <h3>Application of Payments</h3><p>Unless prohibited by applicable law, payments received from the Tenant shall be applied first to the base monthly Rent then due, and only after Rent is satisfied to any other outstanding lawful charges under this Lease, such as utility reimbursements, repair charges, or late fees. Late fees are not Rent and nonpayment of a late fee alone is not grounds for termination of this Lease or eviction.</p>
      <h3>Partial Payments</h3><p>The Landlord may accept a partial payment of Rent without waiving any right or remedy. Acceptance of a partial payment does not cure a default, does not create an agreement to accept partial payments in the future, and does not waive the Landlord's right to demand the balance due or to pursue possession and damages as permitted by Colorado law, except to the extent a statute provides otherwise.</p>
      <h3>Returned Payments</h3><p>If any payment by the Tenant is returned, declined, or dishonored for any reason, the Tenant shall pay a returned-payment charge of twenty dollars ($20.00) as permitted by Colorado law, plus any late fee lawfully accruing if the Rent remains unpaid past the grace period. After two returned payments, the Landlord may require all future payments by certified funds or another verified payment method, provided at least one no-cost payment method remains reasonably available to the Tenant.</p>
      <h3>Utilities</h3><p>${
        d.utilMode === 'included'
          ? `The monthly Rent includes a flat utility fee covering the utilities serving the Leased Property that are held in the Landlord's name. The Tenant shall use utilities reasonably and only for ordinary residential purposes. The Tenant shall not run space heaters continuously, leave water running, charge or power vehicles, mine cryptocurrency, operate commercial equipment, or otherwise consume utilities in a manner materially exceeding ordinary residential use for a unit of this size. Repeated or sustained excessive consumption after written notice constitutes a violation of this Lease, and the Tenant shall reimburse the Landlord the documented cost of consumption attributable to such excessive use.`
          : d.utilMode === 'landlord'
          ? `The Landlord shall pay the charges for utilities serving the Leased Property that are held in the Landlord's name. The Tenant shall use utilities reasonably and only for ordinary residential purposes, and shall reimburse the Landlord the documented cost of consumption materially exceeding ordinary residential use after written notice.`
          : `The Tenant agrees to pay all charges for utilities used in or on the Leased Property during the term of this Lease, unless otherwise agreed in writing.`
      }</p>
      ${d.utilMode !== 'included' && d.utilMode !== 'landlord' ? `<h3>Utility Account Maintenance</h3><p>Where the Tenant is responsible for utility accounts under this Lease, the Tenant shall keep those accounts active and in the Tenant's name without interruption for the full term. If an account reverts to the Landlord's name due to the Tenant's non-payment or account closure, the Tenant shall reimburse the Landlord the actual billed amount within fifteen (15) days of invoice, plus any reconnection fee charged by the utility provider.</p>` : ''}
      ${d.hasSharedUtilities ? `<p>The Leased Property shares one or more utility meters with another unit at the property. Utility costs are allocated using a Ratio Utility Billing System (RUBS), and the Landlord will provide the Tenant with a written disclosure showing how the allocation is calculated, as required by Colorado law.</p>` : ''}
      <h3>Property Maintenance</h3><p>The Tenant is entitled to safe and healthy housing under Colorado's warranty of habitability, and the Landlord is prohibited by law from retaliating against the Tenant for reporting unsafe conditions, requesting repairs, or exercising this right. The Landlord shall maintain the Leased Property in reasonably good repair and perform repairs reasonably necessary to satisfy the implied warranty of habitability.</p>
      <h3>Landlord Access</h3><p>The Landlord or Landlord's agents may enter the Leased Property during reasonable hours for inspection, repairs, or in case of emergency, with at least twenty-four (24) hours' written notice except in an emergency.</p>
      <h3>Annual Renewal Inspection</h3><p>In addition to the general right of entry above, the Landlord reserves the right to conduct a preventive maintenance inspection within thirty (30) days before or after any lease renewal date, with at least forty-eight (48) hours' advance written notice. The Tenant agrees to provide unobstructed access to plumbing fixtures, water shut-offs, electrical panels, smoke and carbon monoxide detectors, and HVAC and water heater equipment for this inspection.</p>
      <h3>Pets</h3><p>${esc(d.pets)}</p>
      <h3>Use of Leased Property</h3><p>The Leased Property shall be used solely as a private residence. The Tenant shall not use the Leased Property for any illegal purpose, any commercial or business activity, or in any manner that constitutes a nuisance or interferes with the quiet enjoyment of neighboring occupants. Violation of this provision constitutes a material default of this Lease.</p>
      <h3>Guests and Occupancy</h3><p>Only the individuals named as Tenant on this Lease may reside at the Leased Property. Any other person staying at the Leased Property for more than fourteen (14) days in any twelve-month period, whether consecutive or not, shall be considered an unauthorized occupant and a material default of this Lease unless approved in writing by the Landlord in advance.</p>
      <h3>Smoking</h3><p>Smoking and vaping of any substance, including tobacco and marijuana, is prohibited inside the Leased Property and in all interior common areas. The parties agree that smoke odor, residue, and burn damage are not normal wear and tear, and the documented, actual cost of remediation (including cleaning, sealing, and repainting reasonably required to remove smoke residue or odor) may be charged to the Tenant and deducted from the security deposit as permitted by law. Nothing in this section prohibits lawful conduct outside the Leased Property where permitted by the Landlord in writing.</p>
      <h3>Vehicles and Parking</h3><p>Only operable, currently registered vehicles belonging to the Tenant or the Tenant's occupants may be parked at the Leased Property, in designated or lawful areas only. No vehicle repairs (other than minor emergency repairs), storage of inoperable or unregistered vehicles, trailers, or commercial equipment is permitted without the Landlord's prior written consent. Vehicles in violation may be removed at the vehicle owner's expense after notice as permitted by law.</p>
      <h3>Trash and Cleanliness</h3><p>The Tenant shall keep the Leased Property in a clean and sanitary condition, dispose of trash promptly in designated receptacles, and not accumulate refuse, debris, or personal property in yards, porches, walkways, or common areas. Conditions that attract pests or create a health hazard constitute a violation of this Lease, and documented pest treatment costs caused by the Tenant's housekeeping may be charged to the Tenant.</p>
      <h3>Criminal Activity</h3><p>The Tenant shall not engage in, permit, or facilitate on or near the Leased Property any criminal activity, including violent or drug-related criminal activity, by the Tenant, any occupant, or any guest. The parties agree that such conduct constitutes a substantial violation of this Lease as described in C.R.S. § 13-40-107.5 and grounds for termination of the tenancy as provided by Colorado law.</p>
      <h3>Assignment and Subletting</h3><p>The Tenant shall not assign this Lease or sublet all or any part of the Leased Property without the Landlord's prior written consent. Any assignment or subletting without such consent is void and constitutes a material default of this Lease, and the Tenant shall remain fully liable under this Lease notwithstanding any such unapproved arrangement.</p>
      <h3>Alterations</h3><p>The Tenant shall not paint, alter, or make any improvements or structural changes to the Leased Property without the Landlord's prior written consent. Any approved alterations become the property of the Landlord unless otherwise agreed in writing, and the Tenant shall restore the Leased Property to its original condition at the Landlord's request, at the Tenant's expense.</p>
      <h3>Renter's Insurance and Tenant's Property</h3><p>The Landlord's insurance does not cover the Tenant's personal property. The Tenant is strongly encouraged to maintain a renter's insurance policy for the duration of this Lease. The Landlord is not liable for any loss, theft, or damage to the Tenant's personal property, regardless of cause, except to the extent caused by the Landlord's negligence or willful misconduct.</p>
      <h3>Joint and Several Liability</h3><p>If more than one person signs this Lease as Tenant, each is jointly and severally liable for the full performance of every obligation under this Lease, including the full amount of Rent, regardless of any private agreement among the Tenants as to how obligations are divided.</p>
      <h3>Indemnification</h3><p>The Tenant shall indemnify and hold the Landlord harmless from any claim, loss, liability, or expense, including reasonable attorney's fees, arising from the Tenant's or the Tenant's guests' use of the Leased Property, except to the extent caused by the Landlord's negligence or willful misconduct.</p>
      <h3>Smoke and Carbon Monoxide Detectors</h3><p>The Landlord shall provide working smoke and carbon monoxide detectors as required by Colorado law. The Tenant shall test detectors periodically, replace batteries as needed, and immediately notify the Landlord in writing of any malfunction. The Tenant shall not disable, remove, or tamper with any detector, and shall be liable for any damage, injury, or loss resulting from a disabled or tampered detector.</p>
      <h3>Abandonment</h3><p>If the Tenant vacates the Leased Property before the end of this Lease without notice, and Rent remains unpaid, or if circumstances reasonably indicate the Tenant has surrendered the Leased Property, the Landlord may consider the Leased Property abandoned and may re-enter and secure it. The Landlord shall handle any personal property left behind in accordance with Colorado law governing abandoned tenant property.</p>
      <h3>Default and Remedies</h3><p>In addition to any other remedy available under this Lease or Colorado law, upon the Tenant's default the Landlord may terminate this Lease, pursue possession of the Leased Property, and recover unpaid Rent, damages, and costs. If the Landlord re-rents the Leased Property following the Tenant's default, the Landlord will apply reasonable efforts to mitigate damages as required by Colorado law, and the Tenant remains liable for any shortfall between the Rent due under this Lease and the rent actually collected, plus the reasonable costs of re-renting.</p>
      <h3>Holdover</h3><p>If the tenancy has actually ended — because the Landlord served a lawful non-renewal or termination notice, or the Tenant gave notice of non-renewal, or the month-to-month continuation was lawfully terminated — and the Tenant nevertheless remains in possession without the Landlord's written consent, the Tenant shall pay use and occupancy at a rate of one hundred fifty percent (150%) of the prorated daily Rent for each day of holdover, in addition to any other damages the Landlord may recover. The automatic month-to-month continuation described above is not a holdover.</p>
      <h3>Bed Bugs</h3><p>The Landlord represents that, to the Landlord's knowledge, the Leased Property is not currently infested with bed bugs. The Tenant shall promptly notify the Landlord in writing or electronically upon knowing or reasonably suspecting the presence of bed bugs. The Tenant shall cooperate with inspection and treatment, including reasonable preparation of the Leased Property, and the Landlord will provide at least forty-eight (48) hours' notice before entry for bed bug inspection or treatment as provided by Colorado law. The parties' rights and obligations regarding bed bugs are governed by C.R.S. §§ 38-12-1001 to -1009.</p>
      <h3>Mold and Moisture</h3><p>The Tenant shall use reasonable ventilation, promptly report in writing any water intrusion, leak, or visible mold, and shall not block ventilation or allow standing moisture caused by the Tenant's use. The Landlord will address reported moisture and mold conditions as required by Colorado's warranty of habitability.</p>
      <h3>Locks and Keys</h3><p>The Tenant shall not change, add, or re-key any lock without the Landlord's prior written consent, except as expressly permitted by Colorado law, and shall provide the Landlord a working key to any approved lock change. Lost keys or lockouts may be charged at the Landlord's documented, actual cost.</p>
      <h3>Rules and Regulations</h3><p>The Tenant shall comply with reasonable written rules and regulations adopted by the Landlord for the safety, care, and cleanliness of the property and the comfort of other occupants, provided such rules are lawful, apply to all tenants, and do not materially modify the economic terms of this Lease. Rules may be updated with reasonable advance written notice.</p>
      <h3>Damage or Destruction</h3><p>If the Leased Property is damaged by fire or other casualty not caused by the Tenant so as to be rendered uninhabitable, either party may terminate this Lease upon written notice, and Rent shall be prorated to the date the Leased Property became uninhabitable. If only partially damaged, the Landlord shall repair with reasonable diligence and Rent shall abate proportionately for the portion rendered unusable, as provided by law. Nothing in this section limits the Tenant's liability for damage caused by the Tenant, the Tenant's occupants, or guests.</p>
      <h3>Copy of Lease</h3><p>The Landlord will provide the Tenant with a copy of this signed Lease, electronically or on paper at the Tenant's request, within seven (7) days after it is fully signed.</p>
      ${d.additional ? '<h3>Additional Terms</h3><p>' + esc(d.additional).replace(/\n/g,'<br>') + '</p>' : ''}
      <h3>Required Colorado and Federal Disclosures</h3>
      <p style="font-weight:bold;">RADON WARNING: The Colorado Department of Public Health and Environment strongly recommends that ALL tenants have an indoor radon test performed before leasing residential real property and recommends having the radon levels mitigated if elevated radon concentrations are found. Elevated radon concentrations can easily be reduced by a qualified radon mitigation professional. Residential real property may be subject to radon gas, a naturally occurring radioactive gas that, when accumulated in a building in sufficient quantities, may present health risks to persons exposed to it over time. Radon is a Class A human carcinogen and is the leading cause of lung cancer in nonsmokers in the United States and the second leading cause of lung cancer overall. The landlord is required to provide the tenant with any known information on radon test results of the leased premises.</p>
      <p>${d.radonKnown && d.radonInfo ? 'Landlord\'s known radon information for the Leased Property: ' + esc(d.radonInfo) : 'The Landlord has no records or reports of radon testing, radon concentrations, or radon mitigation for the Leased Property, and no knowledge of elevated radon concentrations at the Leased Property.'} The most recent brochure published by the Colorado Department of Public Health and Environment regarding radon in real estate transactions is available at cdphe.colorado.gov/radon, and the Tenant acknowledges receipt of the radon disclosures required by C.R.S. § 38-12-803 by signing this Lease.</p>
      ${d.pre1978 ? `<p style="font-weight:bold;">LEAD WARNING STATEMENT: Housing built before 1978 may contain lead-based paint. Lead from paint, paint chips, and dust can pose health hazards if not managed properly. Lead exposure is especially harmful to young children and pregnant women. Before renting pre-1978 housing, lessors must disclose the presence of known lead-based paint and/or lead-based paint hazards in the dwelling. Lessees must also receive a federally approved pamphlet on lead poisoning prevention.</p>
      <p>The Landlord has no knowledge of lead-based paint and/or lead-based paint hazards in the Leased Property and has no reports or records pertaining to lead-based paint and/or lead-based paint hazards in the Leased Property, except as stated in the Additional Terms of this Lease. The Tenant acknowledges receipt of the federally approved pamphlet "Protect Your Family From Lead in Your Home," available at epa.gov/lead, and of the information above.</p>` : ''}
      <p><strong>Source of Income:</strong> Under Colorado law (C.R.S. § 24-34-502), it is an unfair housing practice to refuse to rent, or to discriminate in the terms of rental, because of a person's lawful source of income, including income from any government assistance, housing subsidy, or rental assistance program. The Landlord accepts lawful sources of income, including housing vouchers, in accordance with Colorado law.</p>
      <p style="font-weight:bold;font-size:12pt;">COLORADO WARRANTY OF HABITABILITY NOTICE: Every residential tenant in Colorado has the right to safe and healthy housing. If you believe your home is unsafe or unhealthy, you have the right to request repairs, and your landlord may not retaliate against you for doing so. Deliver written or electronic notice of any uninhabitable or unsafe condition to: ${esc(landlordName)}${d.landlordEmail ? ', ' + esc(d.landlordEmail) : ''}${d.landlordAddr ? ', ' + esc(d.landlordAddr) : ''}.</p>
      <p style="font-weight:bold;font-size:12pt;">AVISO SOBRE LA GARANT&Iacute;A DE HABITABILIDAD DE COLORADO: Todo inquilino residencial en Colorado tiene derecho a una vivienda segura y saludable. Si usted cree que su vivienda es insegura o insalubre, tiene derecho a solicitar reparaciones, y su arrendador no puede tomar represalias en su contra por hacerlo. Entregue un aviso por escrito o electr&oacute;nico de cualquier condici&oacute;n inhabitable o insegura a: ${esc(landlordName)}${d.landlordEmail ? ', ' + esc(d.landlordEmail) : ''}${d.landlordAddr ? ', ' + esc(d.landlordAddr) : ''}.</p>
      <h3>Notices</h3>
      <p>
        Landlord: ${esc(landlordName)}${d.landlordEmail ? ' &mdash; ' + esc(d.landlordEmail) : ''}${d.landlordAddr ? ' &mdash; ' + esc(d.landlordAddr) : ''}<br>
        Tenant: ${esc(d.tenantName)}${d.tenantPhone ? ' &mdash; ' + esc(d.tenantPhone) : ''}${d.tenantEmail ? ' &mdash; ' + esc(d.tenantEmail) : ''}
        ${d.tenantName2 ? '<br>Tenant: ' + esc(d.tenantName2) + (d.tenantPhone2 ? ' &mdash; ' + esc(d.tenantPhone2) : '') + (d.tenantEmail2 ? ' &mdash; ' + esc(d.tenantEmail2) : '') : ''}
      </p>
      <p>Except where a specific method of service is required by statute, the parties agree that written notices under this Lease may be delivered personally, by mail to the addresses above, or electronically by email${d.tenantPhone ? ' or text message' : ''} to the contacts listed above, and that electronic delivery constitutes written notice.</p>
      <h3>No Waiver</h3><p>The Landlord's failure to enforce any provision of this Lease, or acceptance of a partial or late payment, does not waive the Landlord's right to enforce that provision or any other provision later, and does not waive any right to pursue possession or damages for the default.</p>
      <h3>Governing Law and Venue</h3><p>This Lease shall be construed in accordance with the laws of the State of Colorado. Venue for any legal proceeding arising from this Lease shall be the county in which the Leased Property is located. This Lease contains the entire agreement of the parties and may be modified only in writing signed by both parties. If any provision of this Lease is found invalid or unenforceable, the remaining provisions remain in full force and effect.</p>
      <h3>Electronic Signatures and Identity</h3><p>The parties agree that this Lease may be signed electronically, and that an electronic signature has the same legal effect and enforceability as a handwritten signature under applicable federal and Colorado law. By signing, the Tenant certifies that the Tenant is the person named in this Lease, that any identification or supporting documents provided in connection with signing are the Tenant's own, genuine, and unaltered, and that the Tenant signs voluntarily. The parties agree that providing false identity information or falsified documents to induce this Lease is a material misrepresentation, and the Landlord's execution of this Lease relies on the truth of the Tenant's certification.</p>
    `;
  }

  function sigBlockHtml(d) {
    return `
      <div class="sig-block">
        <div class="sig-col">
          ${d.landlordSignatureImage ? `<img class="sig-img" src="${d.landlordSignatureImage}" alt="Landlord signature" style="max-height:55px;display:block;">` : `<div class="sig-script">${esc(d.landlordSignerName || '')}</div>`}
          <div class="sig-line"><strong>${esc(d.entity || 'Landlord')}</strong>${d.landlordSignedAt ? ' &middot; signed ' + fmtDateTime(d.landlordSignedAt) : ''}</div>

        <div class="sig-col">
          ${d.tenantSignatureImage ? `<img class="sig-img" src="${d.tenantSignatureImage}" alt="Tenant signature" style="max-height:55px;display:block;">` : `<div class="sig-script">${esc(d.tenantSignerName || '')}</div>`}
          <div class="sig-line"><strong>${esc([d.tenantName, d.tenantName2].filter(Boolean).join(' and ') || 'Tenant')}</strong>${d.tenantSignedAt ? ' &middot; signed ' + fmtDateTime(d.tenantSignedAt) : ''}${d.tenantAttested ? ' &middot; identity certified under penalty of perjury at signing' : ''}</div>
        </div>
      </div>`;
  }

  // ---------- SHARED SIGNATURE PANEL (type or draw) ----------
  const pads = {};

  function signPanelHtml(idPrefix, title, prefillName) {
    const pre = prefillName || '';
    return `
      <div class="card no-print">
        <div class="section-label">${title}</div>
        <div class="field" style="max-width:360px;">
          <label>Full legal name${pre ? ' — please confirm it\'s spelled correctly' : ''}</label>
          <input type="text" id="${idPrefix}-name" placeholder="Your full name" value="${esc(pre)}">
        </div>
        <div class="sig-tabs">
          <button type="button" class="sig-tab active" id="${idPrefix}-tab-type">Type</button>
          <button type="button" class="sig-tab" id="${idPrefix}-tab-draw">Draw</button>
        </div>
        <div id="${idPrefix}-type-panel">
          <div class="sig-preview" id="${idPrefix}-preview">${esc(pre)}</div>
        </div>

          <div class="pad-wrap"><canvas class="pad" id="${idPrefix}-pad"></canvas></div>
          <div class="pad-controls">

          </div>
        </div>
        <label class="checkbox-row"><input type="checkbox" id="${idPrefix}-agree"> By signing, I intend this as my legal electronic signature on this lease.</label>
        ${idPrefix.startsWith('ts') ? `<label class="checkbox-row"><input type="checkbox" id="${idPrefix}-attest"> I certify under penalty of perjury that I am the person named above, that any identification or documents I provide with this signature are my own, genuine, and unaltered, and that I am signing this lease voluntarily on my own behalf.</label>` : ''}
        <p class="error-text" id="${idPrefix}-error" style="display:none;"></p>

  function setupSignPanel(idPrefix) {
    const nameInput = document.getElementById(idPrefix + '-name');
    const preview = document.getElementById(idPrefix + '-preview');
    nameInput.addEventListener('input', (e) => { preview.textContent = e.target.value; });
    const tabType = document.getElementById(idPrefix + '-tab-type');
    const tabDraw = document.getElementById(idPrefix + '-tab-draw');
    const typePanel = document.getElementById(idPrefix + '-type-panel');
    const drawPanel = document.getElementById(idPrefix + '-draw-panel');
    tabType.addEventListener('click', () => {
      tabType.classList.add('active'); tabDraw.classList.remove('active');
      typePanel.style.display = ''; drawPanel.style.display = 'none';
    });
    tabDraw.addEventListener('click', () => {
      tabDraw.classList.add('active'); tabType.classList.remove('active');
      typePanel.style.display = 'none'; drawPanel.style.display = '';
      if (!pads[idPrefix]) initPad(idPrefix);
    });
  }

  function initPad(idPrefix) {
    const canvas = document.getElementById(idPrefix + '-pad');
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = 140 * ratio;
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#1C2B39';
    const state = { canvas, ctx, drawing: false, hasStroke: false };
    pads[idPrefix] = state;
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    }
    function start(e) { e.preventDefault(); state.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function move(e) { if (!state.drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); state.hasStroke = true; }
    function end() { state.drawing = false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  window.clearPad = function (idPrefix) {
    const state = pads[idPrefix];
    if (!state) return;
    const ratio = window.devicePixelRatio || 1;
    state.ctx.clearRect(0, 0, state.canvas.width / ratio, state.canvas.height / ratio);
    state.hasStroke = false;
  };

  function readSignPanel(idPrefix) {
    const name = document.getElementById(idPrefix + '-name').value.trim();
    const agree = document.getElementById(idPrefix + '-agree').checked;
    const err = document.getElementById(idPrefix + '-error');
    const drawActive = document.getElementById(idPrefix + '-tab-draw').classList.contains('active');
    if (!name) { err.textContent = 'Enter the full legal name.'; err.style.display = ''; return null; }
    if (drawActive && (!pads[idPrefix] || !pads[idPrefix].hasStroke)) { err.textContent = 'Draw a signature, or switch to Type.'; err.style.display = ''; return null; }
    if (!agree) { err.textContent = 'Check the box confirming this is your signature.'; err.style.display = ''; return null; }
    const attestEl = document.getElementById(idPrefix + '-attest');
    if (attestEl && !attestEl.checked) { err.textContent = 'Check the identity certification box to continue.'; err.style.display = ''; return null; }
    err.style.display = 'none';
    const result = { name, signedAt: Date.now() };
    if (attestEl) result.attested = true;
    if (drawActive) result.image = pads[idPrefix].canvas.toDataURL('image/png');
    return result;
  }

  window.copyLink = function (elId) {
    const text = document.getElementById(elId).textContent;
    navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      const orig = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
  };

  async function createShortLink(d, linkElId, btn) {
    const codeEl = document.getElementById(linkElId);
    const orig = btn.textContent;
    btn.textContent = 'Creating…';
    btn.disabled = true;
    try {
      const resp = await fetch('/api/lease', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(d),
      });
      if (!resp.ok) throw new Error('save failed (' + resp.status + ')');
      const out = await resp.json();
      if (!out.id) throw new Error('no id returned');
      const shortUrl = location.origin + '/l/' + out.id;
      if (linkElId === 'tenant-link') { attachIntakeLease(out.id); registerIntakeLease(d, out.id); }
      codeEl.textContent = shortUrl;
      btn.textContent = 'Short link ready ✓';
      if (navigator.clipboard) navigator.clipboard.writeText(shortUrl).catch(() => {});
      setTimeout(() => {
        btn.textContent = 'Copy short link';
        btn.disabled = false;
        btn.onclick = () => copyLinkText(shortUrl, btn);
      }, 1200);
      return shortUrl;
    } catch (e) {
      btn.textContent = "Couldn't create — use Copy link";
      btn.disabled = false;
      setTimeout(() => { btn.textContent = orig; }, 3000);
      return null;
    }
  }

  function copyLinkText(text, btn) {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(() => {
      const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = o; }, 1500);
    });
  }

  function trySmsOrCopy(smsHref, message, btn) {
    let navigated = false;
    const orig = btn.textContent;
    // If the page is still here after trying, the sms link was blocked — fall back to clipboard.
    const fallback = () => {
      if (navigated) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(message).then(() => {
          btn.textContent = 'Copied — paste into a text';
          setTimeout(() => { btn.textContent = orig; }, 2500);
        }).catch(() => {
          btn.textContent = 'Couldn\'t open — use Copy link';
          setTimeout(() => { btn.textContent = orig; }, 2500);
        });
      } else {
        btn.textContent = 'Couldn\'t open — use Copy link';
        setTimeout(() => { btn.textContent = orig; }, 2500);
      }
    };
    // Detect if we actually left/backgrounded the page (i.e. Messages opened).
    const onHide = () => { navigated = true; };
    document.addEventListener('visibilitychange', onHide, { once: true });
    window.addEventListener('pagehide', onHide, { once: true });
    try { window.location.href = smsHref; } catch (e) {}
    setTimeout(() => {
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', onHide);
      fallback();
    }, 700);
  }

  // Save the newest version of the lease and move the tenant's name + last-4 pointer to it
  async function saveAndAdvance(d) {
    try {
      const resp = await fetch('/api/lease', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(d) });
      if (!resp.ok) return null;
      const out = await resp.json();
      if (!out.id) return null;
      const from = window.__currentLeaseId;
      if (from) {
        await fetch('/api/intake', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'advance', fromLeaseId: from, toLeaseId: out.id }) }).catch(() => {});
      }
      window.__currentLeaseId = out.id;
      return out.id;
    } catch (e) { return null; }
  }

  function wireUploadBox(key) {
    window.__pendingUploads = window.__pendingUploads || {};

      if (!e.target || e.target.id !== key + '-input') return;
      const file = e.target.files[0];
      if (!file) return;
      const wrap = document.getElementById(key + '-wrap');
      wrap.innerHTML = '<p class="hint">Processing image&hellip;</p>';
      try {
        const dataUrl = await compressImage(file);
        window.__pendingUploads[key] = dataUrl;
        wrap.innerHTML = `<img class="id-thumb" src="${dataUrl}" alt="${key} preview"><button type="button" class="id-remove" onclick="removeUpload('${key}')">Remove photo</button>`;

        <div class="attachments-title">Attachments</div>
        ${d.tenantIdImage ? `<div class="attach-label">Photo ID on file</div><img class="id-thumb" src="${d.tenantIdImage}" alt="Tenant photo ID" style="max-height:320px;margin-bottom:1.5rem;">` : ''}
        ${d.tenantPayStubImage ? `<div class="attach-label">Proof of income on file</div><img class="id-thumb" src="${d.tenantPayStubImage}" alt="Tenant proof of income" style="max-height:320px;">` : ''}
      </div>
    `;
  }

  function renderLandlordSignFromLink(d) {
    app.innerHTML = header() + `
      <button class="step-back" id="btn-back-landlord-sign">&larr; Start this over</button>
${steps(1, TN_STEPS)}
      <div class="banner banner-brass">${esc(d.tenantSignerName)} has signed. Review and sign below.</div>
      <div class="paper" id="lease-paper">${leaseBody(d)}${sigBlockHtml(d)}${attachmentsPageHtml(d)}</div>
      ${signPanelHtml('lsig', 'Sign as landlord')}
      <div class="btn-row no-print">
        <button class="btn btn-brass" id="btn-submit-landlord-sign">Sign &amp; complete lease</button>
      </div>
    `;
    setupSignPanel('lsig');
    document.getElementById('btn-back-landlord-sign').addEventListener('click', () => {
      if (confirm('Start this screen over? Anything you typed here will be cleared.')) {
        renderLandlordSignFromLink(d);
      }
    });
    document.getElementById('btn-submit-landlord-sign').addEventListener('click', () => {
      const result = readSignPanel('lsig');
      if (!result) return;
      d.landlordSignerName = result.name;
      d.landlordSignedAt = result.signedAt;
      if (result.image) d.landlordSignatureImage = result.image;
      celebrate();
      saveAndAdvance(d);
      goToLease(d);
    });
  }

  function renderCompleted(d) {
    const link = baseUrl() + '#lease=' + encodeState(d);
    const hasAttachments = !!(d.tenantIdImage || d.tenantPayStubImage);
    app.innerHTML = header() + `
${steps(3, TN_STEPS)}
      <div class="banner banner-success"><span class="seal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span><span>Fully signed. Tenant on ${fmtDateTime(d.tenantSignedAt)}, landlord on ${fmtDateTime(d.landlordSignedAt)}.</span></div>
      <div class="paper" id="lease-paper">${leaseBody(d)}${sigBlockHtml(d)}${attachmentsPageHtml(d)}</div>
      <div class="card no-print" style="margin-top:1.5rem;">
        <div class="section-label">Keep a copy</div>
        <p class="hint" style="margin-bottom:0.75rem;">This link contains the complete signed lease${hasAttachments ? ' and attachments' : ''}. Print it, or download a copy to upload into Innago.</p>
        <div class="link-box"><code id="final-link">${esc(link)}</code></div>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn" onclick="copyLink('final-link')">Copy link</button>
          <button class="btn btn-primary" onclick="window.print()">Print / save as PDF</button>
          <button class="btn" id="btn-download-record">Download record</button>
        </div>
      </div>
      <div class="card no-print">
        <div class="section-label">Collected a payment for this lease?</div>
        <p class="hint" style="margin-bottom:0.75rem;">Record what was actually received today — full rent, prorated rent, a deposit, or any mix — as its own receipt.</p>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn" id="btn-new-receipt-for-tenant">New receipt for this tenant</button>
        </div>
      </div>
    `;
    document.getElementById('btn-download-record').addEventListener('click', () => downloadRecord(d));
    document.getElementById('btn-new-receipt-for-tenant').addEventListener('click', () => {
      renderReceiptForm({
        propertyAddress: d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : ''),
        tenantName: [d.tenantName, d.tenantName2].filter(Boolean).join(' and '),
        entity: d.entity,
      });
    });
  }

  async function downloadRecord(d) {
    const paper = document.getElementById('lease-paper');
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Signed Lease</title>
      <style>body{font-family:Georgia,serif;max-width:720px;margin:2rem auto;padding:0 1rem;line-height:1.6;}
      h2{text-align:center;} h3{margin-top:1.5rem;} .sig-block{display:flex;gap:2rem;margin-top:2.5rem;}
      .sig-col{flex:1;} .sig-script{font-size:1.6rem;font-style:italic;font-family:Georgia,serif;} .sig-img{max-height:60px;display:block;} .sig-line{border-top:1px solid #333;padding-top:4px;font-size:0.85rem;color:#555;font-family:sans-serif;}
      .attach-label{font-size:0.8rem;color:#666;font-family:sans-serif;margin-top:2rem;} .id-thumb{max-width:320px;border:1px solid #ccc;border-radius:4px;display:block;margin-top:0.5rem;}
      .attachments-page{page-break-before:always;break-before:page;margin-top:2.5rem;padding-top:2rem;border-top:1px dashed #ccc;} .attachments-title{font-size:1.25rem;font-weight:700;text-align:center;margin:0 0 1.5rem;}</style>
      </head><body>${paper.innerHTML}</body></html>`;
    let downloads = null;
    try { downloads = await claude.use('downloads'); } catch (e) {}
    const fname = 'Lease-' + (d.propertyAddress || 'record').replace(/[^a-z0-9]+/gi, '-') + '-signed.html';
    if (downloads) {
      try { await downloads.save({ filename: fname, data: html }); return; } catch (e) {}
    }
    window.print();
  }

  // ---------- RECEIPTS (separate from the lease) ----------
  let receiptRows = [{ label: 'Rent (prorated)', amount: '' }];
  let receiptDraft = null;

  function renderReceiptForm(prefill) {
    const pre = prefill || {};
    app.innerHTML = header() + `
      <button class="step-back" onclick="goHash('#/new');return false;">&larr; Back to lease</button>
      <h1>New receipt</h1>
      <p class="subhead">Record what was actually collected today — full rent, prorated rent, a security deposit, or any mix. This isn't part of the lease; it's its own record.</p>
      <form id="receipt-form">
        <div class="card">
          <div class="section-label">Who and what</div>
          <div class="field-grid">
            <div class="field full">
              <label>Pick a saved property</label>
              <select id="r-property-select">
                <option value="">— Select a property —</option>
                ${PROPERTIES.map((p, i) => `<option value="${i}">${esc(p.label)}</option>`).join('')}
                <option value="__manual__">Other / not listed — type it below</option>
              </select>
            </div>
            <div class="field full"><label>Property address</label><input type="text" id="r-address" value="${esc(pre.propertyAddress)}" placeholder="Type the property address" required></div>
            <div class="field"><label>Tenant name</label><input type="text" id="r-tenant" value="${esc(pre.tenantName)}" placeholder="Full name" required></div>
            <div class="field"><label>Date received</label><input type="date" id="r-date" value="${new Date().toISOString().slice(0,10)}" required></div>
          </div>
          <div class="field-grid">
            <div class="field"><label>Received by</label><input type="text" id="r-receivedby" value="${esc(pre.entity)}" placeholder="Your name or entity"></div>
            <div class="field"><label>Payment method</label>
              <select id="r-method">
                <option>Cash</option><option>Check</option><option>eCheck</option><option>Money Order</option><option>Card</option><option>Other</option>
              </select>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="section-label">What was collected</div>
          <p class="hint" style="margin-bottom:0.75rem;">Add a line for each item — full rent, prorated rent, security deposit, late fee, whatever actually changed hands today.</p>
          <div id="receipt-rows"></div>
          <datalist id="receipt-labels">
            <option value="Rent"><option value="Rent (prorated)"><option value="Rent (partial payment)">
            <option value="Security deposit"><option value="Security deposit installment"><option value="Pet deposit">
            <option value="Late fee"><option value="Returned payment charge"><option value="Storage unit">
            <option value="Utility reimbursement"><option value="Repair charge">
          </datalist>
          <button type="button" class="btn btn-ghost" id="add-receipt-row" style="padding:0.5rem 0.75rem;font-size:0.8125rem;">+ Add another line</button>
        </div>
        <div class="card">
          <div class="section-label">Partial payment</div>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;">
            <input type="checkbox" id="r-partial" style="width:auto;"> This is a partial payment (tenant still owes a balance)
          </label>
          <div id="r-partial-fields" style="display:none;margin-top:0.75rem;">
            <div class="field"><label>Total amount owed for this period</label><input type="number" min="0" step="0.01" id="r-owed" placeholder="805"></div>
            <div class="field"><label>Remaining balance due by (optional)</label><input type="date" id="r-balancedue"></div>
            <div class="field full"><label>What the balance is for (optional)</label><input type="text" id="r-balancefor" placeholder="e.g. November 2026 rent"></div>
            <p class="hint" id="r-balance-preview"></p>
          </div>
        </div>
        <div class="card">
          <div class="section-label">Acknowledgment</div>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;margin-bottom:0.5rem;">
            <input type="checkbox" id="r-tenantsign" style="width:auto;"> Tenant signs to acknowledge receipt
          </label>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;">
            <input type="checkbox" id="r-landlordsign" style="width:auto;"> Landlord signs
          </label>
          <p class="hint" style="margin-top:0.5rem;">Leave both unchecked for a plain printed receipt with typed names only.</p>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary">Review receipt &rarr;</button>
        </div>
      </form>
    `;
    document.getElementById('r-property-select').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === '' ) return;
      if (val === '__manual__') { document.getElementById('r-address').focus(); return; }
      const match = PROPERTIES[parseInt(val, 10)];
      if (!match) return;
      document.getElementById('r-address').value = match.unit ? match.street + ', ' + match.unit + ', ' + match.cityZip : match.street + ', ' + match.cityZip;
    });
    let rows = [{ label: 'Rent (prorated)', amount: '' }];
    function renderRows() {
      const wrap = document.getElementById('receipt-rows');
      wrap.innerHTML = rows.map((row, i) => `
        <div class="deposit-row" data-idx="${i}" style="grid-template-columns:1.6fr 1fr auto;">
          <input type="text" list="receipt-labels" placeholder="Label (e.g. Rent, Security deposit)" value="${esc(row.label)}" data-field="label">
          <input type="number" min="0" step="1" placeholder="Amount" value="${esc(row.amount)}" data-field="amount">
          <button type="button" class="row-remove" title="Remove" ${rows.length===1?'disabled style="visibility:hidden;"':''}>&times;</button>
        </div>
      `).join('') + `<div class="deposit-total">Total collected: ${fmtMoney(rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0))}</div>`;
      wrap.querySelectorAll('.deposit-row').forEach(rowEl => {
        const idx = parseInt(rowEl.dataset.idx, 10);
        rowEl.querySelectorAll('[data-field]').forEach(input => {
          input.addEventListener('input', () => {
            rows[idx][input.dataset.field] = input.value;
            wrap.querySelector('.deposit-total').textContent = 'Total collected: ' + fmtMoney(rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0));
          });
        });
        rowEl.querySelector('.row-remove').addEventListener('click', () => {
          if (rows.length === 1) return;
          rows.splice(idx, 1);
          renderRows();
        });
      });
    }
    renderRows();
    document.getElementById('add-receipt-row').addEventListener('click', () => {
      rows.push({ label: '', amount: '' });
      renderRows();
    });
    const partialBox = document.getElementById('r-partial');
    const refreshBalance = () => {
      const owed = parseFloat(document.getElementById('r-owed').value) || 0;
      const paid = rows.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
      const prev = document.getElementById('r-balance-preview');
      if (!owed) { prev.textContent = 'Enter the total owed to see the remaining balance.'; return; }
      const bal = Math.round((owed - paid) * 100) / 100;
      prev.textContent = bal > 0 ? 'Paid ' + fmtMoney(paid) + ' of ' + fmtMoney(owed) + '. Remaining balance: ' + fmtMoney(bal) + '.'
        : 'Paid ' + fmtMoney(paid) + ' covers the full ' + fmtMoney(owed) + '. Uncheck "partial payment" if nothing is still owed.';
    };
    partialBox.addEventListener('change', () => { document.getElementById('r-partial-fields').style.display = partialBox.checked ? '' : 'none'; refreshBalance(); });
    document.getElementById('r-owed').addEventListener('input', refreshBalance);
    document.getElementById('receipt-rows').addEventListener('input', refreshBalance);
    document.getElementById('receipt-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const items = rows.filter(r => r.label.trim() !== '' && parseFloat(r.amount) > 0).map(r => ({ label: r.label.trim(), amount: r.amount }));
      if (items.length === 0) { alert('Add at least one line with an amount.'); return; }
      let partial = null;
      if (partialBox.checked) {
        const owed = parseFloat(document.getElementById('r-owed').value) || 0;
        const paid = items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
        if (!owed) { alert('Enter the total amount owed, or uncheck "partial payment."'); return; }
        if (owed <= paid) { alert('The amount paid covers everything owed. Uncheck "partial payment," or fix the total owed.'); return; }
        partial = { owed: owed, balance: Math.round((owed - paid) * 100) / 100,
          dueBy: document.getElementById('r-balancedue').value, forWhat: document.getElementById('r-balancefor').value.trim() };
      }
      receiptDraft = {
        propertyAddress: document.getElementById('r-address').value.trim(),
        tenantName: document.getElementById('r-tenant').value.trim(),
        dateReceived: document.getElementById('r-date').value,
        receivedBy: document.getElementById('r-receivedby').value.trim(),
        method: document.getElementById('r-method').value,
        items: items,
        partial: partial,
        needsTenantSign: document.getElementById('r-tenantsign').checked,
        needsLandlordSign: document.getElementById('r-landlordsign').checked,
      };
      renderReceiptReview(receiptDraft);
    });
  }

  function receiptBody(d) {
    const total = d.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
    return `
      <h2>Receipt of Payment</h2>
      <p style="text-align:center;color:var(--slate);font-family:'Inter',sans-serif;font-size:0.8125rem;margin-top:-1rem;">${fmtDate(d.dateReceived)}</p>
      <p><strong>Property:</strong> ${esc(d.propertyAddress)}<br>
      <strong>Tenant:</strong> ${esc(d.tenantName)}<br>
      <strong>Payment method:</strong> ${esc(d.method)}</p>
      <table style="width:100%;border-collapse:collapse;margin:1.5rem 0;">
        ${d.items.map(it => `<tr><td style="padding:0.4rem 0;border-bottom:1px solid var(--paper-line);">${esc(it.label)}</td><td style="padding:0.4rem 0;border-bottom:1px solid var(--paper-line);text-align:right;">${fmtMoney(it.amount)}</td></tr>`).join('')}
        <tr><td style="padding:0.6rem 0;font-weight:600;">Total received</td><td style="padding:0.6rem 0;font-weight:600;text-align:right;">${fmtMoney(total)}</td></tr>
        ${d.partial ? `<tr><td style="padding:0.4rem 0;">Total owed${d.partial.forWhat ? ' (' + esc(d.partial.forWhat) + ')' : ''}</td><td style="padding:0.4rem 0;text-align:right;">${fmtMoney(d.partial.owed)}</td></tr>
        <tr><td style="padding:0.6rem 0;font-weight:600;color:#b3261e;">Remaining balance${d.partial.dueBy ? ', due by ' + fmtDate(d.partial.dueBy) : ''}</td><td style="padding:0.6rem 0;font-weight:600;text-align:right;color:#b3261e;">${fmtMoney(d.partial.balance)}</td></tr>` : ''}
      </table>
      ${d.partial ? `<p style="font-size:0.85rem;"><strong>Partial payment.</strong> This receipt acknowledges a partial payment only. A balance of ${fmtMoney(d.partial.balance)} remains owed${d.partial.dueBy ? ' and is due by ' + fmtDate(d.partial.dueBy) : ''}. As provided in the lease, the Landlord's acceptance of a partial payment does not waive the remaining balance or any of the Landlord's rights or remedies under the lease or Colorado law.</p>` : ''}
      <p style="font-family:'Inter',sans-serif;font-size:0.8125rem;color:var(--slate);">Received by: ${esc(d.receivedBy || 'Landlord')}</p>
    `;
  }

  function receiptSigBlockHtml(d) {
    if (!d.needsTenantSign && !d.needsLandlordSign) return '';
    const cols = [];
    if (d.needsLandlordSign) cols.push(`
      <div class="sig-col">
        ${d.landlordSignatureImage ? `<img class="sig-img" src="${d.landlordSignatureImage}" style="max-height:55px;display:block;">` : `<div class="sig-script">${esc(d.landlordSignerName || '')}</div>`}
        <div class="sig-line"><strong>${esc(d.receivedBy || 'Landlord')}</strong>${d.landlordSignedAt ? ' &middot; ' + fmtDateTime(d.landlordSignedAt) : ''}</div>
      </div>`);
    if (d.needsTenantSign) cols.push(`
      <div class="sig-col">
        ${d.tenantSignatureImage ? `<img class="sig-img" src="${d.tenantSignatureImage}" style="max-height:55px;display:block;">` : `<div class="sig-script">${esc(d.tenantSignerName || '')}</div>`}
        <div class="sig-line"><strong>${esc(d.tenantName)}</strong>${d.tenantSignedAt ? ' &middot; ' + fmtDateTime(d.tenantSignedAt) : ''}</div>
      </div>`);
    return `<div class="sig-block">${cols.join('')}</div>`;
  }

  function renderReceiptReview(d) {
    const needsAnySign = d.needsTenantSign || d.needsLandlordSign;
    app.innerHTML = header() + `
      <button class="step-back" onclick="renderReceiptForm(receiptDraft)">&larr; Edit</button>
      <div class="paper" id="receipt-paper">${receiptBody(d)}</div>
      ${d.needsLandlordSign ? signPanelHtml('rlsig', 'Landlord signature') : ''}
      ${d.needsTenantSign ? signPanelHtml('rtsig', 'Tenant signature') : ''}
      <div class="btn-row no-print">
        <button class="btn btn-brass" id="btn-finish-receipt">${needsAnySign ? 'Sign & finish receipt' : 'Finish receipt'}</button>
      </div>
    `;
    if (d.needsLandlordSign) setupSignPanel('rlsig');
    if (d.needsTenantSign) setupSignPanel('rtsig');
    document.getElementById('btn-finish-receipt').addEventListener('click', () => {
      if (d.needsLandlordSign) {
        const r = readSignPanel('rlsig');
        if (!r) return;
        d.landlordSignerName = r.name; d.landlordSignedAt = r.signedAt;
        if (r.image) d.landlordSignatureImage = r.image;
      }
      if (d.needsTenantSign) {
        const r = readSignPanel('rtsig');
        if (!r) return;
        d.tenantSignerName = r.name; d.tenantSignedAt = r.signedAt;
        if (r.attested) d.tenantAttested = true;
        if (r.image) d.tenantSignatureImage = r.image;
      }
      if (d.needsTenantSign || d.needsLandlordSign) celebrate();
      location.hash = '#receipt=' + encodeState(d);
    });
  }

  function renderReceiptFinal(d) {
    const link = baseUrl() + '#receipt=' + encodeState(d);
    const subject = 'Receipt — ' + d.propertyAddress;
    const total = d.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
    const msg = 'Receipt for ' + fmtMoney(total) + ' received ' + fmtDate(d.dateReceived) + ' for ' + d.propertyAddress + ': ' + link;
    const mailto = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(msg);
    app.innerHTML = header() + `
      <div class="banner banner-success">Receipt recorded — ${fmtMoney(total)} on ${fmtDate(d.dateReceived)}.</div>
      <div class="paper" id="receipt-paper">${receiptBody(d)}${receiptSigBlockHtml(d)}</div>
      <div class="card no-print" style="margin-top:1.5rem;">
        <div class="section-label">Keep a copy</div>
        <div class="btn-row" style="margin-top:0;">
          <a class="btn btn-brass" href="${mailto}" style="text-decoration:none;display:inline-flex;align-items:center;">Email a copy</a>
          <button class="btn btn-primary" onclick="window.print()">Print / save as PDF</button>
          <button class="btn" id="btn-download-receipt">Download record</button>
        </div>
      </div>
    `;
    document.getElementById('btn-download-receipt').addEventListener('click', () => downloadReceipt(d));
  }

  async function downloadReceipt(d) {
    const paper = document.getElementById('receipt-paper');
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt</title>
      <style>body{font-family:Georgia,serif;max-width:600px;margin:2rem auto;padding:0 1rem;line-height:1.6;}
      h2{text-align:center;} .sig-block{display:flex;gap:2rem;margin-top:2.5rem;} .sig-col{flex:1;}
      .sig-script{font-size:1.6rem;font-style:italic;} .sig-img{max-height:55px;display:block;} .sig-line{border-top:1px solid #333;padding-top:4px;font-size:0.85rem;color:#555;font-family:sans-serif;}</style>
      </head><body>${paper.innerHTML}</body></html>`;
    let downloads = null;
    try { downloads = await claude.use('downloads'); } catch (e) {}
    const fname = 'Receipt-' + (d.propertyAddress || 'record').replace(/[^a-z0-9]+/gi, '-') + '-' + d.dateReceived + '.html';
    if (downloads) {
      try { await downloads.save({ filename: fname, data: html }); return; } catch (e) {}
    }
    window.print();
  }
})();
</script>
</body>
</html>
