<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Dancing+Script:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A2E38; --ink-soft: #55606F; --paper: #FCFBF9; --paper-line: #ECE7DD;
    --slate: #7E7A70; --brass: #B08A3E; --brass-dark: #93712C; --line: #E6E0D5;
    --burgundy: #9A4A55; --burgundy-dark: #7E3A45;
    --card: #FFFFFF; --danger: #B0554C; --success: #4A8262;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EEEAE1; --ink-soft: #CFC8B9; --paper: #2A2823; --paper-line: #403A30;
      --slate: #ABA391; --brass: #DCB878; --brass-dark: #ECCB8E; --line: #4A4336;
      --burgundy: #C77E88; --burgundy-dark: #DE97A0;
      --card: #33302A; --danger: #E89185; --success: #8FD3AC;
    }
  }
  :root[data-theme="dark"] {
    --ink: #EEEAE1; --ink-soft: #CFC8B9; --paper: #2A2823; --paper-line: #403A30;
    --slate: #ABA391; --brass: #DCB878; --brass-dark: #ECCB8E; --line: #4A4336;
    --burgundy: #C77E88; --burgundy-dark: #DE97A0;
    --card: #33302A; --danger: #E89185; --success: #8FD3AC;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 1.0625rem; -webkit-font-smoothing: antialiased; }
  .app { max-width: 900px; margin: 0 auto; padding: 0 1.25rem 5rem; }
  .letterhead { text-align: center; padding: 2.25rem 0 1.25rem; margin-bottom: 2rem; }
  .letterhead-logo { display: block; margin: 0 auto 0.625rem; }
  .letterhead-mark { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.75rem; font-variant: small-caps; letter-spacing: 0.04em; color: var(--ink); }
  .letterhead-mark span { color: var(--burgundy); }
  .letterhead-rule { width: 120px; height: 3px; margin: 0.75rem auto 0; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
  .letterhead-tagline { font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 0.03em; color: var(--slate); margin-top: 0.5rem; }
  .letterhead-nav { text-align: right; margin: 0.75rem 0 -0.5rem; }
  .brand-row { display: none; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.875rem; margin: 0 0 0.375rem; }
  .subhead { color: var(--ink-soft); font-size: 1rem; margin: 0 0 2rem; max-width: 62ch; line-height: 1.6; }
  .btn { font-family: 'Inter', sans-serif; font-size: 0.875rem; font-weight: 500; padding: 0.625rem 1.125rem; border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: var(--slate); }
  .btn-primary { background: var(--burgundy); color: #FBF9F4; border-color: var(--burgundy); }
  .btn-primary:hover { background: var(--burgundy-dark); border-color: var(--burgundy-dark); }
  .btn-brass { background: var(--brass); color: #2A2115; border-color: var(--brass); }
  .btn-brass:hover { background: var(--brass-dark); border-color: var(--brass-dark); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--paper-line); }
  .btn-row { display: flex; gap: 0.625rem; flex-wrap: wrap; margin-top: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--burgundy); border-radius: 4px; padding: 1.75rem; margin-bottom: 1.25rem; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.25rem; }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 0.375rem; margin-bottom: 1rem; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 0.875rem; font-weight: 500; color: var(--ink-soft); }
  .hint { font-size: 0.8125rem; color: var(--ink-soft); margin-top: -2px; }
  input[type="text"], input[type="email"], input[type="tel"], input[type="number"], input[type="date"], select, textarea {
    font-family: 'Inter', sans-serif; font-size: 0.9375rem; padding: 0.625rem 0.75rem;
    border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brass); outline-offset: 1px; border-color: var(--brass); }
  textarea { resize: vertical; min-height: 4.5rem; font-family: 'Inter', sans-serif; }
  .section-label { font-family: 'Source Serif 4', serif; font-size: 1.0625rem; font-weight: 600; margin: 0 0 1rem; color: var(--burgundy); }
  .radio-row { display: flex; gap: 1.25rem; margin-bottom: 1rem; }
  .radio-opt { display: flex; align-items: center; gap: 0.4rem; font-size: 0.875rem; }
  .error-text { color: var(--danger); font-size: 0.8125rem; margin-top: 4px; }
  .paper { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--brass); border-radius: 8px; padding: 3rem; font-family: 'Source Serif 4', serif; font-size: 1rem; line-height: 1.7; max-width: 680px; margin: 0 auto; }
  @media (max-width: 700px) { .paper { padding: 1.75rem 1.5rem; } }
  .paper h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; text-align: center; margin: 0 0 1.75rem; }
  .paper h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
  .paper p { margin: 0 0 0.9rem; }
  .sig-block { display: flex; gap: 2.5rem; margin-top: 2.5rem; flex-wrap: wrap; }
  .sig-col { flex: 1; min-width: 220px; }
  .sig-script { font-family: 'Dancing Script', cursive; font-size: 1.75rem; color: var(--ink); min-height: 2.25rem; margin-bottom: 2px; }
  .sig-line { border-top: 1px solid var(--ink); padding-top: 4px; font-family: 'Inter', sans-serif; font-size: 0.8125rem; color: var(--slate); }
  .sig-line strong { color: var(--ink); font-weight: 500; }
  .step-back { display: inline-flex; align-items: center; gap: 6px; color: var(--slate); font-size: 0.8125rem; cursor: pointer; margin-bottom: 1.25rem; border: none; background: none; padding: 0; font-family: 'Inter', sans-serif; }
  .step-back:hover { color: var(--ink); }
  .banner { display: flex; gap: 0.75rem; padding: 0.875rem 1rem; border-radius: 4px; font-size: 0.8438rem; margin-bottom: 1.5rem; align-items: center; border: 1px solid transparent; }
  .banner-success { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); border-color: color-mix(in srgb, var(--success) 30%, transparent); }
  .banner-brass { background: color-mix(in srgb, var(--brass) 14%, transparent); color: var(--brass-dark); border-color: color-mix(in srgb, var(--brass) 35%, transparent); }
  .banner svg { flex-shrink: 0; }
  .link-box { display: flex; gap: 0.5rem; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0.625rem 0.75rem; margin: 0.75rem 0; }
  .link-box code { flex: 1; font-size: 0.75rem; overflow-x: auto; white-space: nowrap; color: var(--ink-soft); }
  .checkbox-row { display: flex; align-items: flex-start; gap: 0.625rem; font-size: 0.875rem; margin: 1rem 0; }
  .checkbox-row input { width: auto; margin-top: 3px; }
  .sig-preview { font-family: 'Dancing Script', cursive; font-size: 2rem; padding: 0.5rem 0.25rem; border-bottom: 1px solid var(--line); margin-top: 0.5rem; min-height: 2.5rem; }
  .id-upload { border: 1px dashed var(--line); border-radius: 4px; padding: 1rem; text-align: center; }
  .id-upload input[type="file"] { font-size: 0.8125rem; }
  .id-thumb { max-width: 100%; max-height: 220px; border-radius: 4px; border: 1px solid var(--line); display: block; margin: 0.75rem auto 0; }
  .id-remove { font-size: 0.8125rem; color: var(--slate); background: none; border: none; cursor: pointer; margin-top: 0.5rem; text-decoration: underline; padding: 0; }
  .attach-label { font-size: 0.75rem; color: var(--slate); margin: 0.5rem 0 0.25rem; font-family: 'Inter', sans-serif; }
  .deposit-row { display: grid; grid-template-columns: 1.4fr 0.8fr 1.1fr auto; gap: 0.625rem; align-items: center; margin-bottom: 0.625rem; }
  @media (max-width: 620px) { .deposit-row { grid-template-columns: 1fr 1fr; grid-template-areas: "label label" "amount status" "remove remove"; } }
  .row-remove { background: none; border: none; color: var(--slate); cursor: pointer; font-size: 1.125rem; padding: 0 0.375rem; line-height: 1; }
  .row-remove:hover { color: var(--danger); }
  .deposit-total { font-size: 0.875rem; color: var(--ink-soft); margin-top: 0.5rem; text-align: right; }
  .confirm-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--paper-line); font-size: 0.95rem; }
  .confirm-row:last-child { border-bottom: none; }
  .confirm-row .clabel { color: var(--slate); }
  .confirm-row .cval { font-weight: 600; text-align: right; }
  .locked-note { font-size: 0.8125rem; color: var(--slate); margin-top: 0.75rem; }
  .sig-tabs { display: flex; gap: 0.5rem; margin: 0.75rem 0 0.5rem; }
  .sig-tab { font-family: 'Inter', sans-serif; font-size: 0.8125rem; font-weight: 500; padding: 0.4rem 0.875rem; border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--slate); cursor: pointer; }
  .sig-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pad-wrap { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); margin-top: 0.5rem; }
  canvas.pad { width: 100%; height: 140px; display: block; touch-action: none; border-radius: 4px; cursor: crosshair; }
  .pad-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
  .pad-hint { font-size: 0.75rem; color: var(--slate); }
  .seal { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1.5px solid var(--brass); border-radius: 50%; color: var(--brass); flex-shrink: 0; }
  .attachments-page { page-break-before: always; break-before: page; margin-top: 2.5rem; padding-top: 2rem; border-top: 1px dashed var(--paper-line); }
  .attachments-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; text-align: center; margin: 0 0 1.5rem; }
  @media print {
    body { background: white; } .no-print { display: none !important; }
    .paper { border: none; padding: 0; max-width: 100%; } .app { padding: 0; max-width: 100%; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function () {
  const app = document.getElementById('app');
  let landlordDraft = null;

  function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const PROPERTIES = (() => {
    const base = [
      { street: '2043 East 4th Street', cityZip: 'Pueblo, Colorado 81001', entity: 'TLDR Enterprise LLC' },
      { street: '2045 East 4th Street', cityZip: 'Pueblo, CO 81001', entity: 'TLDR Enterprise LLC' },
      { street: '310 Catalina Court', cityZip: 'Colorado Springs, CO 80906', entity: 'Catalina 310 LLC' },
      { street: '312 Catalina Court', cityZip: 'Colorado Springs, Colorado 80906', entity: 'DiOrio House LLC' },
      { street: '625 Brinn Court', cityZip: 'Colorado Springs, Colorado 80911', entity: 'Leslie French' },
      { street: '2420 E Willamette Ave', cityZip: 'Colorado Springs, CO 80909', entity: 'Bregitta Place LLC' },
      { street: '2728 Casden Cir', cityZip: 'Colorado Springs, CO 80909', entity: 'Casden LLC' },
      { street: '4258 Deerfield Hills Rd', cityZip: 'Colorado Springs, CO 80916', entity: '4258 Deerfield LLC' },
      { street: '4166 Deerfield Hills Rd', cityZip: 'Colorado Springs, CO 80916', entity: '4116 Deerfield LLC' },
      { street: '410 Windsor Ln', cityZip: 'Fountain, CO 80817', entity: 'Windsor 410 LLC' },
      { street: '412 Windsor Ln', cityZip: 'Fountain, CO 80817', entity: 'Windsor 410 LLC' },
      { street: '414 Windsor Ln', cityZip: 'Fountain, CO 80817', entity: '414 Windsor Lane LLC' },
      { street: '416 Windsor Ln', cityZip: 'Fountain, CO 80817', entity: '414 Windsor Lane LLC' },
      { street: '4445 London Ln', cityZip: 'Colorado Springs, CO 80916', entity: '4445 London LLC' },
      { street: '4208 Loomis Ave', cityZip: 'Colorado Springs, CO 80906', entity: '4208 Loomis LLC' },
      { street: '4210 Loomis Ave', cityZip: 'Colorado Springs, CO 80906', entity: '4210 Loomis LLC' },
      { street: '4206 Loomis Ave', cityZip: 'Colorado Springs, CO 80906', entity: 'Trumaine Hughes' },
      { street: '544 E Platte Ave', cityZip: 'Colorado Springs, CO 80903', entity: 'Leslie French' },
    ];
    const list = base.map(p => ({ ...p, unit: '', label: p.street + ' — ' + p.cityZip }));
    for (let i = 1; i <= 11; i++) {
      list.push({ street: '411 Troy Ave', unit: 'Unit ' + i, cityZip: 'Pueblo, Colorado 81001', entity: 'TLDR Enterprise LLC', label: '411 Troy Ave, Unit ' + i + ' — Pueblo, CO 81001' });
    }
    return list;
  })();

  const ENTITIES = (() => {
    const seen = new Set();
    const out = [];
    PROPERTIES.forEach(p => { if (p.entity && !seen.has(p.entity)) { seen.add(p.entity); out.push(p.entity); } });
    return out.sort();
  })();

  function entityOptionsHtml(selected) {
    return ENTITIES.map(e => `<option value="${esc(e)}"${e === selected ? ' selected' : ''}>${esc(e)}</option>`).join('') +
      `<option value="__other__"${selected && !ENTITIES.includes(selected) ? ' selected' : ''}>Other (type it in)…</option>`;
  }

  function propertyDatalistHtml(id) {
    return `<datalist id="${id}">${PROPERTIES.map(p => `<option value="${esc(p.label)}">`).join('')}</datalist>`;
  }

  function findPropertyByLabel(label) {
    return PROPERTIES.find(p => p.label === label);
  }
  function fmtMoney(n) { const v = parseFloat(n); if (isNaN(v)) return '$0.00'; return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDate(iso) { if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }
  function fmtDateTime(ts) { if (!ts) return ''; return new Date(ts).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}); }
  function ordinalSuffix(n) { n = parseInt(n,10); if (n%10===1 && n%100!==11) return 'st'; if (n%10===2 && n%100!==12) return 'nd'; if (n%10===3 && n%100!==13) return 'rd'; return 'th'; }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read file.'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not read image.'));
        img.onload = () => {
          const maxDim = 1000;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- CELEBRATION EFFECTS (fires when a signature is submitted) ----------
  const CELEBRATE_COLORS = ['#6B1F2A', '#A9862F', '#1B1F2A', '#2F5D3A', '#8A6D23'];
  const CELEBRATE_TYPES = ['confetti', 'fireworks', 'streamers', 'balloons', 'stars', 'keys', 'houses', 'poppers', 'coins', 'petals'];

  function celebrate() {
    const type = CELEBRATE_TYPES[Math.floor(Math.random() * CELEBRATE_TYPES.length)];
    runCelebration(type);
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function runCelebration(type) {
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let particles = [];

    const mk = (over) => Object.assign({
      x: rnd(0, W), y: rnd(-H * 0.3, 0), vx: rnd(-1, 1), vy: rnd(2, 4),
      gravity: 0.05, rot: rnd(0, 360), vr: rnd(-6, 6), size: rnd(6, 12),
      color: pick(CELEBRATE_COLORS), shape: 'rect',
    }, over);

    if (type === 'confetti') {
      for (let i = 0; i < 140; i++) particles.push(mk({ shape: 'rect', vy: rnd(2, 5), w: rnd(6, 10), h: rnd(10, 16) }));
    } else if (type === 'streamers') {
      for (let i = 0; i < 55; i++) particles.push(mk({ shape: 'rect', vy: rnd(1.5, 3), vx: rnd(-0.4, 0.4), w: 4, h: rnd(40, 80), gravity: 0.02, vr: rnd(-2, 2) }));
    } else if (type === 'stars') {
      for (let i = 0; i < 90; i++) particles.push(mk({ shape: 'star', x: rnd(0, W), y: rnd(0, H), vy: rnd(-1, -0.3), gravity: 0, size: rnd(4, 8) }));
    } else if (type === 'petals') {
      for (let i = 0; i < 90; i++) particles.push(mk({ shape: 'dot', vy: rnd(0.6, 1.6), vx: rnd(-0.6, 0.6), gravity: 0.01, size: rnd(4, 8) }));
    } else if (type === 'keys') {
      for (let i = 0; i < 50; i++) particles.push(mk({ shape: 'key', vy: rnd(1.5, 3.2), size: rnd(10, 16) }));
    } else if (type === 'houses') {
      for (let i = 0; i < 45; i++) particles.push(mk({ shape: 'house', vy: rnd(1.5, 3), vr: rnd(-2, 2), size: rnd(10, 16) }));
    } else if (type === 'coins') {
      for (let i = 0; i < 60; i++) particles.push(mk({ shape: 'coin', vy: rnd(2, 4), spin: rnd(0, 6), vspin: rnd(0.12, 0.26), color: '#A9862F', size: rnd(6, 10) }));
    } else if (type === 'balloons') {
      for (let i = 0; i < 16; i++) particles.push(mk({ shape: 'balloon', y: H + rnd(0, 200), vy: -rnd(1, 2.2), vx: rnd(-0.3, 0.3), gravity: 0, sway: rnd(0, Math.PI * 2), size: rnd(18, 28) }));
    } else if (type === 'fireworks') {
      for (let b = 0; b < 4; b++) {
        const cx = rnd(W * 0.2, W * 0.8), cy = rnd(H * 0.15, H * 0.45), delay = b * 18;
        for (let i = 0; i < 36; i++) {
          const a = rnd(0, Math.PI * 2), sp = rnd(1.5, 5);
          particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, gravity: 0.04, shape: 'dot', size: rnd(2, 4), color: pick(CELEBRATE_COLORS), delay, born: false });
        }
      }
    } else if (type === 'poppers') {
      for (let side = 0; side < 2; side++) {
        const startX = side === 0 ? 0 : W;
        const dir = side === 0 ? 1 : -1;
        for (let i = 0; i < 65; i++) {
          particles.push({ x: startX, y: H, vx: dir * rnd(2, 7), vy: -rnd(4, 9), gravity: 0.15, shape: 'rect', w: 5, h: 9, rot: rnd(0, 360), vr: rnd(-10, 10), color: pick(CELEBRATE_COLORS) });
        }
      }
    }

    const start = performance.now();
    const duration = type === 'fireworks' ? 2400 : (type === 'balloons' || type === 'stars') ? 3200 : 3000;

    function drawParticle(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.shape === 'rect') {
        ctx.rotate((p.rot || 0) * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-(p.w || p.size) / 2, -(p.h || p.size) / 2, p.w || p.size, p.h || p.size);
      } else if (p.shape === 'dot') {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill();
      } else if (p.shape === 'star') {
        ctx.fillStyle = p.color;
        ctx.rotate((p.rot || 0) * Math.PI / 180);
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a1 = (i * 4 * Math.PI) / 5 - Math.PI / 2;
          const r = i === 0 ? p.size : p.size;
          ctx.lineTo(Math.cos(a1) * p.size, Math.sin(a1) * p.size);
        }
        ctx.closePath(); ctx.fill();
      } else if (p.shape === 'key') {
        ctx.rotate((p.rot || 0) * Math.PI / 180);
        ctx.strokeStyle = p.color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(-p.size * 0.3, 0, p.size * 0.3, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(p.size * 0.7, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.size * 0.5, 0); ctx.lineTo(p.size * 0.5, p.size * 0.25); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.size * 0.7, 0); ctx.lineTo(p.size * 0.7, p.size * 0.25); ctx.stroke();
      } else if (p.shape === 'house') {
        ctx.rotate((p.rot || 0) * Math.PI / 180);
        ctx.strokeStyle = p.color; ctx.lineWidth = 1.5;
        const s = p.size;
        ctx.beginPath(); ctx.moveTo(-s / 2, s / 4); ctx.lineTo(0, -s / 2); ctx.lineTo(s / 2, s / 4); ctx.stroke();
        ctx.strokeRect(-s / 2, s / 4, s, s / 2);
      } else if (p.shape === 'coin') {
        const scaleX = Math.abs(Math.cos(p.spin));
        ctx.scale(scaleX, 1);
        ctx.fillStyle = p.color; ctx.strokeStyle = '#7A5F20'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (p.shape === 'balloon') {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(0, 0, p.size / 2.4, p.size / 1.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = p.color; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, p.size / 1.8); ctx.lineTo(0, p.size / 1.8 + 18); ctx.stroke();
      }
      ctx.restore();
    }

    function frame(t) {
      const elapsed = t - start;
      const fadeStart = duration * 0.72;
      const globalAlpha = elapsed < fadeStart ? 1 : Math.max(0, 1 - (elapsed - fadeStart) / (duration - fadeStart));
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = globalAlpha;
      particles.forEach(p => {
        if (type === 'fireworks') {
          if (elapsed < p.delay) return;
        }
        if (type === 'balloons') {
          p.sway += 0.03;
          p.x += Math.sin(p.sway) * 0.4;
        }
        p.x += p.vx; p.y += p.vy;
        p.vy += (p.gravity || 0);
        if (type === 'fireworks') p.vx *= 0.985, p.vy *= 0.985;
        if (p.vr) p.rot += p.vr;
        if (p.vspin) p.spin += p.vspin;
        drawParticle(p);
      });
      ctx.globalAlpha = 1;
      if (elapsed < duration) requestAnimationFrame(frame);
      else canvas.remove();
    }
    requestAnimationFrame(frame);
  }

  function encodeState(obj) {
    return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(obj)))));
  }
  function decodeState(str) {
    try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(str))))); }
    catch (e) { return null; }
  }
  function baseUrl() {
    return location.origin + location.pathname;
  }

  function route() {
    const hash = location.hash;
    if (hash.startsWith('#lease=')) {
      const state = decodeState(hash.slice(7));
      if (!state) { renderBadLink(); return; }
      renderLeaseView(state);
      return;
    }
    if (hash.startsWith('#receipt=')) {
      const state = decodeState(hash.slice(9));
      if (!state) { renderBadLink(); return; }
      renderReceiptFinal(state);
      return;
    }
    if (hash === '#/receipt') { renderReceiptForm(); return; }
    renderForm();

  function leaseBody(d) {
    const landlordName = d.entity || 'Landlord';
    const tenants = [d.tenantName, d.tenantName2].filter(Boolean).join(' and ');
    const propLine = d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : '') + ', ' + d.cityZip;
    const rentText = fmtMoney(d.rent);
    let rentClause;
    if (d.hasPetRent && parseFloat(d.petRentAmount) > 0) {
      const per = parseFloat(d.petRentAmount) || 0;
      const count = parseInt(d.petCount) || 0;
      const petTotal = per * count;
      const totalRent = (parseFloat(d.rent) || 0) + petTotal;
      rentClause = `The Tenant agrees to pay to the Landlord as rent for the use and occupancy of the Leased Property the sum of ${rentText} per month, plus pet rent of ${fmtMoney(per)} per pet per month for ${count} pet${count === 1 ? '' : 's'} (${fmtMoney(petTotal)} per month), for a total monthly Rent of ${fmtMoney(totalRent)}, due on the ${esc(String(d.dueDay||1))}${ordinalSuffix(d.dueDay||1)} day of each month ("Rent"). Pet rent adjusts if the number of pets on the Leased Property changes, subject to the Landlord's written approval of any new pet.`;
    } else {
      rentClause = `The Tenant agrees to pay to the Landlord as rent for the use and occupancy of the Leased Property the sum of ${rentText} due on the ${esc(String(d.dueDay||1))}${ordinalSuffix(d.dueDay||1)} day of each month ("Rent").`;
    }
    let termParagraph;
    if (d.termType === 'mtm') {
      termParagraph = `This Lease is a month-to-month tenancy, starting on ${fmtDate(d.startDate)} ("Start Date"). Either party may terminate this tenancy by providing written notice in accordance with Colorado law.`;
    } else {
      termParagraph = `This Lease shall be for a fixed term, starting on ${fmtDate(d.startDate)} ("Start Date") and ending on ${fmtDate(d.endDate)} ("Termination Date"). The Tenant will be entitled to possession of the Leased Property beginning on the Start Date and shall maintain possession until the Termination Date unless terminated through approved methods outlined in this Lease or under Colorado law. At the expiration of the Termination Date, unless the Landlord serves a lawful non-renewal or no-fault notice as permitted under Colorado law, or the Tenant provides written notice of non-renewal at least thirty (30) days before the Termination Date, this tenancy shall continue on a month-to-month basis under the same terms and conditions contained in this Lease.`;
    }
    let depositParagraph;
    const deposits = Array.isArray(d.deposits) ? d.deposits : [];
    if (deposits.length === 0) {
      depositParagraph = `No security deposit or additional fees are required under this Lease.`;
    } else {
      const lines = deposits.map(dep => {
        const amt = fmtMoney(dep.amount);
        if (dep.status === 'carried') {
          return `The Tenant previously paid, and the Landlord continues to hold in trust, a ${esc(dep.label)} of ${amt} for the Leased Property. This carries forward and continues to be held under this Lease.`;
        } else if (dep.status === 'nonrefundable') {
          return `The Tenant shall pay a ${esc(dep.label)} of ${amt}. This fee is non-refundable and is not held as a security deposit.`;
        }
        return `At the time of signing this Lease, the Tenant shall pay to the Landlord, in trust, a ${esc(dep.label)} of ${amt}, to be held and disbursed for the Tenant's damages to the Leased Property or other defaults under this Lease, as provided by law.`;
      });
      const refundable = deposits.filter(dep => dep.status !== 'nonrefundable');

  function setupSignPanel(idPrefix) {
    const nameInput = document.getElementById(idPrefix + '-name');
    const preview = document.getElementById(idPrefix + '-preview');
    nameInput.addEventListener('input', (e) => { preview.textContent = e.target.value; });
    const tabType = document.getElementById(idPrefix + '-tab-type');
    const tabDraw = document.getElementById(idPrefix + '-tab-draw');
    const typePanel = document.getElementById(idPrefix + '-type-panel');
    const drawPanel = document.getElementById(idPrefix + '-draw-panel');
    tabType.addEventListener('click', () => {
      tabType.classList.add('active'); tabDraw.classList.remove('active');
      typePanel.style.display = ''; drawPanel.style.display = 'none';
    });
    tabDraw.addEventListener('click', () => {
      tabDraw.classList.add('active'); tabType.classList.remove('active');
      typePanel.style.display = 'none'; drawPanel.style.display = '';
      if (!pads[idPrefix]) initPad(idPrefix);
    });
  }

  function initPad(idPrefix) {
    const canvas = document.getElementById(idPrefix + '-pad');
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = 140 * ratio;
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#1C2B39';
    const state = { canvas, ctx, drawing: false, hasStroke: false };
    pads[idPrefix] = state;
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    }
    function start(e) { e.preventDefault(); state.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function move(e) { if (!state.drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); state.hasStroke = true; }
    function end() { state.drawing = false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  window.clearPad = function (idPrefix) {
    const state = pads[idPrefix];
    if (!state) return;
    const ratio = window.devicePixelRatio || 1;
    state.ctx.clearRect(0, 0, state.canvas.width / ratio, state.canvas.height / ratio);
    state.hasStroke = false;
  };

  function readSignPanel(idPrefix) {
    const name = document.getElementById(idPrefix + '-name').value.trim();
    const agree = document.getElementById(idPrefix + '-agree').checked;
    const err = document.getElementById(idPrefix + '-error');
    const drawActive = document.getElementById(idPrefix + '-tab-draw').classList.contains('active');
    if (!name) { err.textContent = 'Enter the full legal name.'; err.style.display = ''; return null; }
    if (drawActive && (!pads[idPrefix] || !pads[idPrefix].hasStroke)) { err.textContent = 'Draw a signature, or switch to Type.'; err.style.display = ''; return null; }
    if (!agree) { err.textContent = 'Check the box confirming this is your signature.'; err.style.display = ''; return null; }
    err.style.display = 'none';
    const result = { name, signedAt: Date.now() };
    if (drawActive) result.image = pads[idPrefix].canvas.toDataURL('image/png');
    return result;
  }

  window.copyLink = function (elId) {
    const text = document.getElementById(elId).textContent;
    navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      const orig = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
  };

  function trySmsOrCopy(smsHref, message, btn) {
    let navigated = false;
    const orig = btn.textContent;
    // If the page is still here after trying, the sms link was blocked — fall back to clipboard.
    const fallback = () => {
      if (navigated) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(message).then(() => {
          btn.textContent = 'Copied — paste into a text';
          setTimeout(() => { btn.textContent = orig; }, 2500);
        }).catch(() => {
          btn.textContent = 'Couldn\'t open — use Copy link';
          setTimeout(() => { btn.textContent = orig; }, 2500);
        });
      } else {
        btn.textContent = 'Couldn\'t open — use Copy link';
        setTimeout(() => { btn.textContent = orig; }, 2500);
      }
    };
    // Detect if we actually left/backgrounded the page (i.e. Messages opened).
    const onHide = () => { navigated = true; };
    document.addEventListener('visibilitychange', onHide, { once: true });
    window.addEventListener('pagehide', onHide, { once: true });
    try { window.location.href = smsHref; } catch (e) {}
    setTimeout(() => {
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', onHide);
      fallback();
    }, 700);
  }

  function wireUploadBox(key) {
    window.__pendingUploads = window.__pendingUploads || {};
    window.__pendingUploads[key] = null;
    document.getElementById(key + '-wrap').addEventListener('change', async (e) => {
      if (!e.target || e.target.id !== key + '-input') return;
      const file = e.target.files[0];
      if (!file) return;
      const wrap = document.getElementById(key + '-wrap');
      wrap.innerHTML = '<p class="hint">Processing image&hellip;</p>';
      try {
        const dataUrl = await compressImage(file);
        window.__pendingUploads[key] = dataUrl;
        wrap.innerHTML = `<img class="id-thumb" src="${dataUrl}" alt="${key} preview"><button type="button" class="id-remove" onclick="removeUpload('${key}')">Remove photo</button>`;
      } catch (err) {
        wrap.innerHTML = `<p class="error-text">Could not process that image. Try another photo.</p><input type="file" accept="image/*" capture="environment" id="${key}-input">`;
      }
    });
  }

  window.removeUpload = function (key) {
    window.__pendingUploads[key] = null;
    const wrap = document.getElementById(key + '-wrap');
    wrap.innerHTML = `<input type="file" accept="image/*" capture="environment" id="${key}-input">`;
  };

    });

    document.getElementById('btn-flag-problem').addEventListener('click', () => {
      const subject = 'Correction needed on lease — ' + d.propertyAddress;
      const body = 'Hi, before I sign the lease for ' + d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : '') + ', something in the terms needs to be corrected:\n\n[describe what is wrong here]\n\nThanks.';
      const to = d.landlordEmail || '';
      window.location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    });

    document.getElementById('btn-submit-tenant-sign').addEventListener('click', () => {
      const result = readSignPanel('sig');
      if (!result) return;
      // capture any corrections the tenant made to their own contact info
      d.tenantName = document.getElementById('tc-name').value.trim() || d.tenantName;
      d.tenantPhone = document.getElementById('tc-phone').value.trim();
      d.tenantEmail = document.getElementById('tc-email').value.trim();
      d.tenantSignerName = result.name;
      d.tenantSignedAt = result.signedAt;
      if (result.image) d.tenantSignatureImage = result.image;
      const uploads = window.__pendingUploads || {};
      if (uploads.idphoto) d.tenantIdImage = uploads.idphoto;
      if (uploads.paystub) d.tenantPayStubImage = uploads.paystub;
      celebrate();
      renderTenantSentToLandlord(d);
    });
  }

  function renderTenantSentToLandlord(d) {
    const link = baseUrl() + '#lease=' + encodeState(d);
    const subject = 'Ready for your signature — ' + d.propertyAddress;
    const msg = 'I\'ve signed the lease for ' + d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : '') + '. It\'s ready for your signature: ' + link;
    const emailBody = 'Hi,\n\n' + msg.replace('here:', 'here:\n\n');
    const mailtoBack = 'mailto:' + encodeURIComponent(d.landlordEmail || '') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(emailBody);
    const smsBack = d.landlordPhone ? 'sms:' + encodeURIComponent(d.landlordPhone.replace(/[^\d+]/g, '')) + '?body=' + encodeURIComponent(msg) : '';
    const linkTooLong = link.length > 1800;
    app.innerHTML = header(true) + `
      <button class="step-back" id="btn-back-to-tenant-resign">&larr; Re-do my signature</button>
      <div class="banner banner-success">Signed. If your landlord is here, hand them the device now.</div>
      <div class="card">
        <div class="section-label">Landlord signing in person</div>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn btn-primary" id="btn-go-direct-landlord">Hand device to landlord to sign now</button>
        </div>
      </div>
      <div class="card">
        <div class="section-label">Landlord signing remotely</div>
        <div class="link-box"><code id="landlord-link">${esc(link)}</code></div>
        <div class="btn-row" style="margin-top:0;">
          ${linkTooLong
            ? `<button class="btn btn-brass" onclick="copyLink('landlord-link')">Copy link to paste into email or text</button>`
            : `<a class="btn btn-brass" href="${mailtoBack}" style="text-decoration:none;display:inline-flex;align-items:center;">Email to landlord</a>
               ${smsBack ? `<button class="btn btn-brass" id="btn-text-landlord">Text to landlord</button>` : ''}
               <button class="btn" onclick="copyLink('landlord-link')">Copy link</button>`
          }
        </div>
        ${linkTooLong ? '<p class="hint" style="margin-top:0.75rem;">This link is long, so auto-filling an email or text isn\'t reliable — copy it and paste it in manually.</p>' : ''}
      </div>
    `;
    document.getElementById('btn-go-direct-landlord').addEventListener('click', () => {
      location.hash = '#lease=' + encodeState(d);
    });
    const textLandlordBtn = document.getElementById('btn-text-landlord');
    if (textLandlordBtn) textLandlordBtn.addEventListener('click', () => trySmsOrCopy(smsBack, msg, textLandlordBtn));
    document.getElementById('btn-back-to-tenant-resign').addEventListener('click', () => {
      if (confirm('Clear your signature and sign again?')) {
        delete d.tenantSignerName; delete d.tenantSignedAt; delete d.tenantSignatureImage;
        renderTenantSign(d);
      }
    });
  }

  function attachmentsPageHtml(d) {
    if (!d.tenantIdImage && !d.tenantPayStubImage) return '';
    return `
      <div class="attachments-page">
        <div class="attachments-title">Attachments</div>
        ${d.tenantIdImage ? `<div class="attach-label">Photo ID on file</div><img class="id-thumb" src="${d.tenantIdImage}" alt="Tenant photo ID" style="max-height:320px;margin-bottom:1.5rem;">` : ''}
        ${d.tenantPayStubImage ? `<div class="attach-label">Proof of income on file</div><img class="id-thumb" src="${d.tenantPayStubImage}" alt="Tenant proof of income" style="max-height:320px;">` : ''}
      </div>
    `;
  }

  function renderLandlordSignFromLink(d) {
    app.innerHTML = header() + `
      <button class="step-back" id="btn-back-landlord-sign">&larr; Start this over</button>
      <div class="banner banner-brass">${esc(d.tenantSignerName)} has signed. Review and sign below.</div>
      <div class="paper" id="lease-paper">${leaseBody(d)}${sigBlockHtml(d)}${attachmentsPageHtml(d)}</div>
      ${signPanelHtml('lsig', 'Sign as landlord')}
      <div class="btn-row no-print">
        <button class="btn btn-brass" id="btn-submit-landlord-sign">Sign &amp; complete lease</button>
      </div>
    `;
    setupSignPanel('lsig');
    document.getElementById('btn-back-landlord-sign').addEventListener('click', () => {
      if (confirm('Start this screen over? Anything you typed here will be cleared.')) {
        renderLandlordSignFromLink(d);
      }
    });
    document.getElementById('btn-submit-landlord-sign').addEventListener('click', () => {
      const result = readSignPanel('lsig');
      if (!result) return;
      d.landlordSignerName = result.name;
      d.landlordSignedAt = result.signedAt;
      if (result.image) d.landlordSignatureImage = result.image;
      celebrate();
      location.hash = '#lease=' + encodeState(d);
    });
  }

  function renderCompleted(d) {
    const link = baseUrl() + '#lease=' + encodeState(d);
    const hasAttachments = !!(d.tenantIdImage || d.tenantPayStubImage);
    app.innerHTML = header() + `
      <div class="banner banner-success"><span class="seal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span><span>Fully signed. Tenant on ${fmtDateTime(d.tenantSignedAt)}, landlord on ${fmtDateTime(d.landlordSignedAt)}.</span></div>
      <div class="paper" id="lease-paper">${leaseBody(d)}${sigBlockHtml(d)}${attachmentsPageHtml(d)}</div>
      <div class="card no-print" style="margin-top:1.5rem;">
        <div class="section-label">Keep a copy</div>
        <p class="hint" style="margin-bottom:0.75rem;">This link contains the complete signed lease${hasAttachments ? ' and attachments' : ''}. Print it, or download a copy to upload into Innago.</p>
        <div class="link-box"><code id="final-link">${esc(link)}</code></div>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn" onclick="copyLink('final-link')">Copy link</button>
          <button class="btn btn-primary" onclick="window.print()">Print / save as PDF</button>
          <button class="btn" id="btn-download-record">Download record</button>
        </div>
      </div>
      <div class="card no-print">
        <div class="section-label">Collected a payment for this lease?</div>
        <p class="hint" style="margin-bottom:0.75rem;">Record what was actually received today — full rent, prorated rent, a deposit, or any mix — as its own receipt.</p>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn" id="btn-new-receipt-for-tenant">New receipt for this tenant</button>
        </div>
      </div>
    `;
    document.getElementById('btn-download-record').addEventListener('click', () => downloadRecord(d));
    document.getElementById('btn-new-receipt-for-tenant').addEventListener('click', () => {
      renderReceiptForm({
        propertyAddress: d.propertyAddress + (d.unitLabel ? ', ' + d.unitLabel : ''),
        tenantName: [d.tenantName, d.tenantName2].filter(Boolean).join(' and '),
        entity: d.entity,
      });
    });
  }

  async function downloadRecord(d) {
    const paper = document.getElementById('lease-paper');
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Signed Lease</title>
      <style>body{font-family:Georgia,serif;max-width:720px;margin:2rem auto;padding:0 1rem;line-height:1.6;}
      h2{text-align:center;} h3{margin-top:1.5rem;} .sig-block{display:flex;gap:2rem;margin-top:2.5rem;}
      .sig-col{flex:1;} .sig-script{font-size:1.6rem;font-style:italic;font-family:Georgia,serif;} .sig-img{max-height:60px;display:block;} .sig-line{border-top:1px solid #333;padding-top:4px;font-size:0.85rem;color:#555;font-family:sans-serif;}
      .attach-label{font-size:0.8rem;color:#666;font-family:sans-serif;margin-top:2rem;} .id-thumb{max-width:320px;border:1px solid #ccc;border-radius:4px;display:block;margin-top:0.5rem;}
      .attachments-page{page-break-before:always;break-before:page;margin-top:2.5rem;padding-top:2rem;border-top:1px dashed #ccc;} .attachments-title{font-size:1.25rem;font-weight:700;text-align:center;margin:0 0 1.5rem;}</style>
      </head><body>${paper.innerHTML}</body></html>`;
    let downloads = null;
    try { downloads = await claude.use('downloads'); } catch (e) {}
    const fname = 'Lease-' + (d.propertyAddress || 'record').replace(/[^a-z0-9]+/gi, '-') + '-signed.html';
    if (downloads) {
      try { await downloads.save({ filename: fname, data: html }); return; } catch (e) {}
    }
    window.print();
  }

  // ---------- RECEIPTS (separate from the lease) ----------
  let receiptRows = [{ label: 'Rent (prorated)', amount: '' }];
  let receiptDraft = null;

  function renderReceiptForm(prefill) {
    const pre = prefill || {};
    app.innerHTML = header() + `
      <button class="step-back" onclick="location.hash='';return false;">&larr; Back to lease</button>
      <h1>New receipt</h1>
      <p class="subhead">Record what was actually collected today — full rent, prorated rent, a security deposit, or any mix. This isn't part of the lease; it's its own record.</p>
      <form id="receipt-form">
        <div class="card">
          <div class="section-label">Who and what</div>
          <div class="field-grid">
            <div class="field full">
              <label>Pick a saved property</label>
              <select id="r-property-select">
                <option value="">— Select a property —</option>
                ${PROPERTIES.map((p, i) => `<option value="${i}">${esc(p.label)}</option>`).join('')}
                <option value="__manual__">Other / not listed — type it below</option>
              </select>
            </div>
            <div class="field full"><label>Property address</label><input type="text" id="r-address" value="${esc(pre.propertyAddress)}" placeholder="Type the property address" required></div>
            <div class="field"><label>Tenant name</label><input type="text" id="r-tenant" value="${esc(pre.tenantName)}" placeholder="Full name" required></div>
            <div class="field"><label>Date received</label><input type="date" id="r-date" value="${new Date().toISOString().slice(0,10)}" required></div>
          </div>
          <div class="field-grid">
            <div class="field"><label>Received by</label><input type="text" id="r-receivedby" value="${esc(pre.entity)}" placeholder="Your name or entity"></div>
            <div class="field"><label>Payment method</label>
              <select id="r-method">
                <option>Cash</option><option>Check</option><option>eCheck</option><option>Money Order</option><option>Card</option><option>Other</option>
              </select>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="section-label">What was collected</div>
          <p class="hint" style="margin-bottom:0.75rem;">Add a line for each item — full rent, prorated rent, security deposit, late fee, whatever actually changed hands today.</p>
          <div id="receipt-rows"></div>
          <button type="button" class="btn btn-ghost" id="add-receipt-row" style="padding:0.5rem 0.75rem;font-size:0.8125rem;">+ Add another line</button>
        </div>
        <div class="card">
          <div class="section-label">Acknowledgment</div>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;margin-bottom:0.5rem;">
            <input type="checkbox" id="r-tenantsign" style="width:auto;"> Tenant signs to acknowledge receipt
          </label>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;">
            <input type="checkbox" id="r-landlordsign" style="width:auto;"> Landlord signs
          </label>
          <p class="hint" style="margin-top:0.5rem;">Leave both unchecked for a plain printed receipt with typed names only.</p>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary">Review receipt &rarr;</button>
        </div>
      </form>
    `;
    document.getElementById('r-property-select').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === '' ) return;
      if (val === '__manual__') { document.getElementById('r-address').focus(); return; }
      const match = PROPERTIES[parseInt(val, 10)];
      if (!match) return;
      document.getElementById('r-address').value = match.unit ? match.street + ', ' + match.unit + ', ' + match.cityZip : match.street + ', ' + match.cityZip;
    });
    let rows = [{ label: 'Rent (prorated)', amount: '' }];
    function renderRows() {
      const wrap = document.getElementById('receipt-rows');
      wrap.innerHTML = rows.map((row, i) => `
        <div class="deposit-row" data-idx="${i}" style="grid-template-columns:1.6fr 1fr auto;">
          <input type="text" placeholder="Label (e.g. Security Deposit)" value="${esc(row.label)}" data-field="label">
          <input type="number" min="0" step="1" placeholder="Amount" value="${esc(row.amount)}" data-field="amount">
          <button type="button" class="row-remove" title="Remove" ${rows.length===1?'disabled style="opacity:.3;cursor:default;"':''}>&times;</button>
        </div>
      `).join('') + `<div class="deposit-total">Total collected: ${fmtMoney(rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0))}</div>`;
      wrap.querySelectorAll('.deposit-row').forEach(rowEl => {
        const idx = parseInt(rowEl.dataset.idx, 10);
        rowEl.querySelectorAll('[data-field]').forEach(input => {
          input.addEventListener('input', () => {
            rows[idx][input.dataset.field] = input.value;
            wrap.querySelector('.deposit-total').textContent = 'Total collected: ' + fmtMoney(rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0));
          });
        });
        rowEl.querySelector('.row-remove').addEventListener('click', () => {
          if (rows.length === 1) return;
          rows.splice(idx, 1);
          renderRows();
        });
      });
    }
    renderRows();
    document.getElementById('add-receipt-row').addEventListener('click', () => {
      rows.push({ label: '', amount: '' });
      renderRows();
    });
    document.getElementById('receipt-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const items = rows.filter(r => r.label.trim() !== '' && parseFloat(r.amount) > 0).map(r => ({ label: r.label.trim(), amount: r.amount }));
      if (items.length === 0) { alert('Add at least one line with an amount.'); return; }
      receiptDraft = {
        propertyAddress: document.getElementById('r-address').value.trim(),
        tenantName: document.getElementById('r-tenant').value.trim(),
        dateReceived: document.getElementById('r-date').value,
        receivedBy: document.getElementById('r-receivedby').value.trim(),
        method: document.getElementById('r-method').value,
        items: items,
        needsTenantSign: document.getElementById('r-tenantsign').checked,
        needsLandlordSign: document.getElementById('r-landlordsign').checked,
      };
      renderReceiptReview(receiptDraft);
    });
  }

  function receiptBody(d) {
    const total = d.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
    return `
      <h2>Receipt of Payment</h2>
      <p style="text-align:center;color:var(--slate);font-family:'Inter',sans-serif;font-size:0.8125rem;margin-top:-1rem;">${fmtDate(d.dateReceived)}</p>
      <p><strong>Property:</strong> ${esc(d.propertyAddress)}<br>
      <strong>Tenant:</strong> ${esc(d.tenantName)}<br>
      <strong>Payment method:</strong> ${esc(d.method)}</p>
      <table style="width:100%;border-collapse:collapse;margin:1.5rem 0;">
        ${d.items.map(it => `<tr><td style="padding:0.4rem 0;border-bottom:1px solid var(--paper-line);">${esc(it.label)}</td><td style="padding:0.4rem 0;border-bottom:1px solid var(--paper-line);text-align:right;">${fmtMoney(it.amount)}</td></tr>`).join('')}
        <tr><td style="padding:0.6rem 0;font-weight:600;">Total received</td><td style="padding:0.6rem 0;font-weight:600;text-align:right;">${fmtMoney(total)}</td></tr>
      </table>
      <p style="font-family:'Inter',sans-serif;font-size:0.8125rem;color:var(--slate);">Received by: ${esc(d.receivedBy || 'Landlord')}</p>
    `;
  }

  function receiptSigBlockHtml(d) {
    if (!d.needsTenantSign && !d.needsLandlordSign) return '';
    const cols = [];
    if (d.needsLandlordSign) cols.push(`
      <div class="sig-col">
        ${d.landlordSignatureImage ? `<img class="sig-img" src="${d.landlordSignatureImage}" style="max-height:55px;display:block;">` : `<div class="sig-script">${esc(d.landlordSignerName || '')}</div>`}
        <div class="sig-line"><strong>${esc(d.receivedBy || 'Landlord')}</strong>${d.landlordSignedAt ? ' &middot; ' + fmtDateTime(d.landlordSignedAt) : ''}</div>
      </div>`);
    if (d.needsTenantSign) cols.push(`
      <div class="sig-col">
        ${d.tenantSignatureImage ? `<img class="sig-img" src="${d.tenantSignatureImage}" style="max-height:55px;display:block;">` : `<div class="sig-script">${esc(d.tenantSignerName || '')}</div>`}
        <div class="sig-line"><strong>${esc(d.tenantName)}</strong>${d.tenantSignedAt ? ' &middot; ' + fmtDateTime(d.tenantSignedAt) : ''}</div>
      </div>`);
    return `<div class="sig-block">${cols.join('')}</div>`;
  }

  function renderReceiptReview(d) {
    const needsAnySign = d.needsTenantSign || d.needsLandlordSign;
    app.innerHTML = header() + `
      <button class="step-back" onclick="renderReceiptForm(receiptDraft)">&larr; Edit</button>
      <div class="paper" id="receipt-paper">${receiptBody(d)}</div>
      ${d.needsLandlordSign ? signPanelHtml('rlsig', 'Landlord signature') : ''}
      ${d.needsTenantSign ? signPanelHtml('rtsig', 'Tenant signature') : ''}
      <div class="btn-row no-print">
        <button class="btn btn-brass" id="btn-finish-receipt">${needsAnySign ? 'Sign & finish receipt' : 'Finish receipt'}</button>
      </div>
    `;
    if (d.needsLandlordSign) setupSignPanel('rlsig');
    if (d.needsTenantSign) setupSignPanel('rtsig');
    document.getElementById('btn-finish-receipt').addEventListener('click', () => {
      if (d.needsLandlordSign) {
        const r = readSignPanel('rlsig');
        if (!r) return;
        d.landlordSignerName = r.name; d.landlordSignedAt = r.signedAt;
        if (r.image) d.landlordSignatureImage = r.image;
      }
      if (d.needsTenantSign) {
        const r = readSignPanel('rtsig');
        if (!r) return;
        d.tenantSignerName = r.name; d.tenantSignedAt = r.signedAt;
        if (r.image) d.tenantSignatureImage = r.image;
      }
      if (d.needsTenantSign || d.needsLandlordSign) celebrate();
      location.hash = '#receipt=' + encodeState(d);
    });
  }

  function renderReceiptFinal(d) {
    const link = baseUrl() + '#receipt=' + encodeState(d);
    const subject = 'Receipt — ' + d.propertyAddress;
    const total = d.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0);
    const msg = 'Receipt for ' + fmtMoney(total) + ' received ' + fmtDate(d.dateReceived) + ' for ' + d.propertyAddress + ': ' + link;
    const mailto = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(msg);
    app.innerHTML = header() + `
      <div class="banner banner-success">Receipt recorded — ${fmtMoney(total)} on ${fmtDate(d.dateReceived)}.</div>
      <div class="paper" id="receipt-paper">${receiptBody(d)}${receiptSigBlockHtml(d)}</div>
      <div class="card no-print" style="margin-top:1.5rem;">
        <div class="section-label">Keep a copy</div>
        <div class="btn-row" style="margin-top:0;">
          <a class="btn btn-brass" href="${mailto}" style="text-decoration:none;display:inline-flex;align-items:center;">Email a copy</a>
          <button class="btn btn-primary" onclick="window.print()">Print / save as PDF</button>
          <button class="btn" id="btn-download-receipt">Download record</button>
        </div>
      </div>
    `;
    document.getElementById('btn-download-receipt').addEventListener('click', () => downloadReceipt(d));
  }

  async function downloadReceipt(d) {
    const paper = document.getElementById('receipt-paper');
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt</title>
      <style>body{font-family:Georgia,serif;max-width:600px;margin:2rem auto;padding:0 1rem;line-height:1.6;}
      h2{text-align:center;} .sig-block{display:flex;gap:2rem;margin-top:2.5rem;} .sig-col{flex:1;}
      .sig-script{font-size:1.6rem;font-style:italic;} .sig-img{max-height:55px;display:block;} .sig-line{border-top:1px solid #333;padding-top:4px;font-size:0.85rem;color:#555;font-family:sans-serif;}</style>
      </head><body>${paper.innerHTML}</body></html>`;
    let downloads = null;
    try { downloads = await claude.use('downloads'); } catch (e) {}
    const fname = 'Receipt-' + (d.propertyAddress || 'record').replace(/[^a-z0-9]+/gi, '-') + '-' + d.dateReceived + '.html';
    if (downloads) {
      try { await downloads.save({ filename: fname, data: html }); return; } catch (e) {}
    }
    window.print();
  }
})();
</script>
</body>
</html>
