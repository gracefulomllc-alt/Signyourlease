<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF4EE">
<title>Lease Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Dancing+Script:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1F2430; --ink-soft: #4A5565; --paper: #FFFFFF; --paper-line: #EFE6DC;
    --slate: #5E5D59; --brass: #C9962E; --brass-dark: #6E4E0E; --line: #EEE3D8;
    --burgundy: #B23A4E; --burgundy-dark: #8F2B3D;
    --card: #FFFFFF; --danger: #A8372D; --success: #256B45;
  }
  :root { color-scheme: light only; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 1.0625rem; -webkit-font-smoothing: antialiased; }
  .app { max-width: 900px; margin: 0 auto; padding: 0 1.25rem 5rem; }
  .letterhead { text-align: center; padding: 2.25rem 0 1.25rem; margin-bottom: 2rem; }
  .letterhead-logo { display: block; margin: 0 auto 0.625rem; }
  .letterhead-mark { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.75rem; font-variant: small-caps; letter-spacing: 0.04em; color: var(--ink); }
  .letterhead-mark span { color: var(--burgundy); }
  .letterhead-rule { width: 120px; height: 3px; margin: 0.75rem auto 0; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
  .letterhead-tagline { font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 0.03em; color: var(--slate); margin-top: 0.5rem; }
  .letterhead-nav { text-align: right; margin: 0.75rem 0 -0.5rem; }
  .brand-row { display: none; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.875rem; margin: 0 0 0.375rem; }
  .subhead { color: var(--ink-soft); font-size: 1rem; margin: 0 0 2rem; max-width: 62ch; line-height: 1.6; }
  .btn { font-family: 'Inter', sans-serif; font-size: 0.875rem; font-weight: 500; padding: 0.625rem 1.125rem; border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: var(--slate); }
  .btn-primary { background: var(--burgundy); color: #FBF9F4; border-color: var(--burgundy); }
  .btn-primary:hover { background: var(--burgundy-dark); border-color: var(--burgundy-dark); }
  .btn-brass { background: var(--brass); color: #2A2115; border-color: var(--brass); }
  .btn-brass:hover { background: var(--brass-dark); border-color: var(--brass-dark); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--paper-line); }
  .btn-row { display: flex; gap: 0.625rem; flex-wrap: wrap; margin-top: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--burgundy); border-radius: 4px; padding: 1.75rem; margin-bottom: 1.25rem; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.25rem; }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 0.375rem; margin-bottom: 1rem; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 0.875rem; font-weight: 500; color: var(--ink-soft); }
  .hint { font-size: 0.8125rem; color: var(--ink-soft); margin-top: -2px; }
  input[type="text"], input[type="email"], input[type="tel"], input[type="number"], input[type="date"], select, textarea {
    font-family: 'Inter', sans-serif; font-size: 0.9375rem; padding: 0.625rem 0.75rem;
    border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brass); outline-offset: 1px; border-color: var(--brass); }
  textarea { resize: vertical; min-height: 4.5rem; font-family: 'Inter', sans-serif; }
  .section-label { font-family: 'Source Serif 4', serif; font-size: 1.0625rem; font-weight: 600; margin: 0 0 1rem; color: var(--burgundy); }
  .radio-row { display: flex; gap: 1.25rem; margin-bottom: 1rem; }
  .radio-opt { display: flex; align-items: center; gap: 0.4rem; font-size: 0.875rem; }
  .error-text { color: var(--danger); font-size: 0.8125rem; margin-top: 4px; }
  .paper { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--brass); border-radius: 8px; padding: 3rem; font-family: 'Source Serif 4', serif; font-size: 1rem; line-height: 1.7; max-width: 680px; margin: 0 auto; }
  @media (max-width: 700px) { .paper { padding: 1.75rem 1.5rem; } }
  .paper h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; text-align: center; margin: 0 0 1.75rem; }
  .paper h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
  .paper p { margin: 0 0 0.9rem; }
  .sig-block { display: flex; gap: 2.5rem; margin-top: 2.5rem; flex-wrap: wrap; }
  .sig-col { flex: 1; min-width: 220px; }
  .sig-script { font-family: 'Dancing Script', cursive; font-size: 1.75rem; color: var(--ink); min-height: 2.25rem; margin-bottom: 2px; }
  .sig-line { border-top: 1px solid var(--ink); padding-top: 4px; font-family: 'Inter', sans-serif; font-size: 0.8125rem; color: var(--slate); }
  .sig-line strong { color: var(--ink); font-weight: 500; }
  .step-back { display: inline-flex; align-items: center; gap: 6px; color: var(--slate); font-size: 0.8125rem; cursor: pointer; margin-bottom: 1.25rem; border: none; background: none; padding: 0; font-family: 'Inter', sans-serif; }
  .step-back:hover { color: var(--ink); }
  .banner { display: flex; gap: 0.75rem; padding: 0.875rem 1rem; border-radius: 4px; font-size: 0.8438rem; margin-bottom: 1.5rem; align-items: center; border: 1px solid transparent; }
  .banner-success { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); border-color: color-mix(in srgb, var(--success) 30%, transparent); }
  .banner-brass { background: color-mix(in srgb, var(--brass) 14%, transparent); color: var(--brass-dark); border-color: color-mix(in srgb, var(--brass) 35%, transparent); }
  .banner svg { flex-shrink: 0; }
  .link-box { display: flex; gap: 0.5rem; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0.625rem 0.75rem; margin: 0.75rem 0; }
  .link-box code { flex: 1; font-size: 0.75rem; overflow-x: auto; white-space: nowrap; color: var(--ink-soft); }
  .checkbox-row { display: flex; align-items: flex-start; gap: 0.625rem; font-size: 0.875rem; margin: 1rem 0; }
  .checkbox-row input { width: auto; margin-top: 3px; }
  .sig-preview { font-family: 'Dancing Script', cursive; font-size: 2rem; padding: 0.5rem 0.25rem; border-bottom: 1px solid var(--line); margin-top: 0.5rem; min-height: 2.5rem; }
  .id-upload { border: 1px dashed var(--line); border-radius: 4px; padding: 1rem; text-align: center; }
  .id-upload input[type="file"] { font-size: 0.8125rem; }
  .id-thumb { max-width: 100%; max-height: 220px; border-radius: 4px; border: 1px solid var(--line); display: block; margin: 0.75rem auto 0; }
  .id-remove { font-size: 0.8125rem; color: var(--slate); background: none; border: none; cursor: pointer; margin-top: 0.5rem; text-decoration: underline; padding: 0; }
  .attach-label { font-size: 0.75rem; color: var(--slate); margin: 0.5rem 0 0.25rem; font-family: 'Inter', sans-serif; }
  .deposit-row { display: grid; grid-template-columns: 1.4fr 0.8fr 1.1fr auto; gap: 0.625rem; align-items: center; margin-bottom: 0.625rem; }
  @media (max-width: 620px) { .deposit-row { grid-template-columns: 1fr 1fr; grid-template-areas: "label label" "amount status" "remove remove"; } }
  .row-remove { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 1.125rem; padding: 0 0.375rem; line-height: 1; }
  .row-remove:hover { color: var(--danger); }
  .deposit-total { font-size: 0.875rem; color: var(--ink-soft); margin-top: 0.5rem; text-align: right; }
  .confirm-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--paper-line); font-size: 0.95rem; }
  .confirm-row:last-child { border-bottom: none; }
  .confirm-row .clabel { color: var(--slate); }
  .confirm-row .cval { font-weight: 600; text-align: right; }
  .locked-note { font-size: 0.8125rem; color: var(--slate); margin-top: 0.75rem; }
  .ci-toggle { display: flex; gap: 0.625rem; margin-top: 1rem; }
  .ci-btn { flex: 1; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500; padding: 0.7rem 1rem; border-radius: 6px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .ci-btn.correct.active { background: color-mix(in srgb, var(--success) 16%, transparent); border-color: var(--success); color: var(--success); }
  .ci-btn.incorrect.active { background: color-mix(in srgb, var(--danger) 14%, transparent); border-color: var(--danger); color: var(--danger); }
  .ci-readonly { font-size: 0.95rem; line-height: 1.7; }
  .ci-readonly strong { font-weight: 600; }
  .sig-tabs { display: flex; gap: 0.5rem; margin: 0.75rem 0 0.5rem; }
  .sig-tab { font-family: 'Inter', sans-serif; font-size: 0.8125rem; font-weight: 500; padding: 0.4rem 0.875rem; border-radius: 4px; border: 1px solid var(--line); background: var(--card); color: var(--slate); cursor: pointer; }
  .sig-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pad-wrap { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); margin-top: 0.5rem; }
  canvas.pad { width: 100%; height: 140px; display: block; touch-action: none; border-radius: 4px; cursor: crosshair; }
  .pad-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
  .pad-hint { font-size: 0.75rem; color: var(--slate); }
  .seal { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1.5px solid var(--brass); border-radius: 50%; color: var(--brass); flex-shrink: 0; }
  .attachments-page { page-break-before: always; break-before: page; margin-top: 2.5rem; padding-top: 2rem; border-top: 1px dashed var(--paper-line); }
  .attachments-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; text-align: center; margin: 0 0 1.5rem; }
  @media print {
    body { background: white; } .no-print { display: none !important; }
    .paper { border: none; padding: 0; max-width: 100%; } .app { padding: 0; max-width: 100%; }
  }

  /* ---------- brighter, friendlier screen look (print unaffected) ---------- */
  @media screen {
    body { background: linear-gradient(180deg, #FFF4EE 0px, #FFFBF7 320px, #FFFFFF 900px) fixed; }
    .letterhead { padding-top: 2rem; }
    .letterhead-mark { font-size: 1.95rem; }
    .letterhead-rule { height: 4px; border-radius: 4px; }
    .card { border: 1px solid #F1E4D8; border-top: 4px solid var(--burgundy); border-radius: 14px;
            box-shadow: 0 8px 24px rgba(178, 58, 78, 0.07), 0 1px 3px rgba(31, 36, 48, 0.05); }
    .paper { border-radius: 14px; box-shadow: 0 8px 24px rgba(31, 36, 48, 0.06); }
    .btn { border-radius: 10px; font-weight: 600; padding: 0.7rem 1.2rem; transition: transform .12s, box-shadow .12s, background .15s; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(31, 36, 48, 0.10); }
    .btn-primary { background: linear-gradient(135deg, #B23A4E, #8F2B3D); border-color: #9E3045; color: #fff; }
    .btn-brass { background: linear-gradient(135deg, #DDAA3C, #C08A22); border-color: #BE8A24; color: #2A1D05; }
    .btn-ghost { background: #FFF6F2; border: 1px solid #F3DCD4; color: var(--ink); }
    .btn-ghost:hover { background: #FFEDE6; }
    .section-label { font-size: 1.15rem; }
    input, select, textarea { border-radius: 10px !important; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--burgundy) !important; box-shadow: 0 0 0 3px rgba(178, 58, 78, 0.15); }
    .banner { border-radius: 12px; }
    h1 { color: var(--ink); }
  }

  @media screen {
    .step-back { background: #fff; border: 1px solid #EBD9CF; border-radius: 999px; padding: 0.5rem 0.95rem; color: var(--ink); font-size: 0.9rem; font-weight: 600; min-height: 40px; box-shadow: 0 1px 3px rgba(31,36,48,0.06); }
    .step-back:hover { background: #FFF1EA; color: var(--ink); }
    .letterhead-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; text-align: center; margin: -0.5rem 0 1.25rem; }
    .letterhead-nav .step-back { margin: 0 !important; text-decoration: none; }
    .steps { display: flex; gap: 0.35rem; margin: 0 auto 1.5rem; max-width: 640px; }
    .steps .st { flex: 1; text-align: center; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); }
    .steps .st .bar { height: 6px; border-radius: 6px; background: #F0E2D8; margin-bottom: 0.4rem; }
    .steps .st.done .bar { background: #D98C99; }
    .steps .st.on .bar { background: var(--burgundy); }
    .steps .st.on { color: var(--burgundy); }
    .steps .st.done { color: var(--ink); }
    .sig-tab { font-size: 0.9rem; padding: 0.55rem 1.1rem; border-radius: 999px; color: var(--ink); }
    .sig-tab.active { background: var(--burgundy); border-color: var(--burgundy); color: #fff; }
    .ci-btn { border-radius: 10px; }
    .hint { font-size: 0.875rem; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function () {
  const app = document.getElementById('app');
  let landlordDraft = null;

  function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const PROPERTIES = (() => {
    const base = [
      { street: '2043 East 4th Street', unit: 'Unit A', cityZip: 'Pueblo, Colorado 81001', entity: 'TLDR Enterprise LLC' },
      { street: '2043 East 4th Street', unit: 'Unit B', cityZip: 'Pueblo, Colorado 81001', entity: 'TLDR Enterprise LLC' },
      { street: '2045 East 4th Street', cityZip: 'Pueblo, CO 81001', entity: 'TLDR Enterprise LLC' },
      { street: '310 Catalina Court', cityZip: 'Colorado Springs, CO 80906', entity: 'Catalina 310 LLC' },
      { street: '312 Catalina Court', cityZip: 'Colorado Springs, Colorado 80906', entity: 'DiOrio House LLC' },
      { street: '625 Brinn Court', cityZip: 'Colorado Springs, Colorado 80911', entity: 'Leslie French' },
      { street: '2420 E Willamette Ave', cityZip: 'Colorado Springs, CO 80909', entity: 'Bregitta Place LLC' },
      { street: '2728 Casden Cir', cityZip: 'Colorado Springs, CO 80909', entity: 'Casden LLC' },
      { street: '4258 Deerfield Hills Rd', cityZip: 'Colorado Springs, CO 80916', entity: '4258 Deerfield LLC' },
      { street: '4166 Deerfield Hills Rd', cityZip: 'Colorado Springs, CO 80916', entity: '4116 Deerfield LLC' },
      { street: '410 Windsor Ln', cityZip: 'Fountain, CO 80817', entity: 'Windsor 410 LLC' },
      { street: '412 Windsor Ln', cityZip: 'Fountain, CO 80817', entity: 'Windsor 410 LLC' },
      { street: '414 Windsor Ln', cityZip: 'Fountain, CO 80817', entity: '414 Windsor Lane LLC' },
      { street: '416 Windsor Ln', cityZip: 'Fountain, CO 80817', entity: '414 Windsor Lane LLC' },
      { street: '4445 London Ln', cityZip: 'Colorado Springs, CO 80916', entity: '4445 London LLC' },
      { street: '4208 Loomis Ave', cityZip: 'Colorado Springs, CO 80906', entity: '4208 Loomis LLC' },
      { street: '4210 Loomis Ave', cityZip: 'Colorado Springs, CO 80906', entity: '4210 Loomis LLC' },
      { street: '4206 Loomis Ave', cityZip: 'Colorado Springs, CO 80906', entity: 'Trumaine Hughes' },
      { street: '544 E Platte Ave', cityZip: 'Colorado Springs, CO 80903', entity: 'Leslie French' },
    ];
    const list = base.map(p => ({ ...p, unit: p.unit || '', label: p.street + (p.unit ? ', ' + p.unit : '') + ' — ' + p.cityZip }));
    for (let i = 1; i <= 11; i++) {
      list.push({ street: '411 Troy Ave', unit: 'Unit ' + i, cityZip: 'Pueblo, Colorado 81001', entity: 'TLDR Enterprise LLC', label: '411 Troy Ave, Unit ' + i + ' — Pueblo, CO 81001' });
    }
    return list;
  })();

  const ENTITIES = (() => {
    const seen = new Set();
    const out = [];
    PROPERTIES.forEach(p => { if (p.entity && !seen.has(p.entity)) { seen.add(p.entity); out.push(p.entity); } });
    return out.sort();
  })();

  function entityOptionsHtml(selected) {
    return ENTITIES.map(e => `<option value="${esc(e)}"${e === selected ? ' selected' : ''}>${esc(e)}</option>`).join('') +
      `<option value="__other__"${selected && !ENTITIES.includes(selected) ? ' selected' : ''}>Other (type it in)…</option>`;
  }

  function propertyDatalistHtml(id) {
    return `<datalist id="${id}">${PROPERTIES.map(p => `<option value="${esc(p.label)}">`).join('')}</datalist>`;
  }

  function findPropertyByLabel(label) {
    return PROPERTIES.find(p => p.label === label);
  }
  function fmtMoney(n) { const v = parseFloat(n); if (isNaN(v)) return '$0.00'; return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDate(iso) { if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }
  function fmtDateTime(ts) { if (!ts) return ''; return new Date(ts).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}); }
  function ordinalSuffix(n) { n = parseInt(n,10); if (n%10===1 && n%100!==11) return 'st'; if (n%10===2 && n%100!==12) return 'nd'; if (n%10===3 && n%100!==13) return 'rd'; return 'th'; }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read file.'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not read image.'));
        img.onload = () => {
          const maxDim = 1000;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- CELEBRATION EFFECTS (fires when a signature is submitted) ----------
  const CELEBRATE_COLORS = ['#6B1F2A', '#A9862F', '#1B1F2A', '#2F5D3A', '#8A6D23'];
  const CELEBRATE_TYPES = ['confetti', 'fireworks', 'streamers', 'balloons', 'stars', 'keys', 'houses', 'poppers', 'coins', 'petals'];

  function celebrate() {
    const type = CELEBRATE_TYPES[Math.floor(Math.random() * CELEBRATE_TYPES.length)];
    runCelebration(type);
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function runCelebration(type) {
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let particles = [];

    const mk = (over) => Object.assign({
      x: rnd(0, W), y: rnd(-H * 0.3, 0), vx: rnd(-1, 1), vy: rnd(2, 4),
      gravity: 0.05, rot: rnd(0, 360), vr: rnd(-6, 6), size: rnd(6, 12),
      color: pick(CELEBRATE_COLORS), shape: 'rect',
    }, over);

    if (type === 'confetti') {
      for (let i = 0; i < 140; i++) particles.push(mk({ shape: 'rect', vy: rnd(2, 5), w: rnd(6, 10), h: rnd(10, 16) }));
    } else if (type === 'streamers') {
      for (let i = 0; i < 55; i++) particles.push(mk({ shape: 'rect', vy: rnd(1.5, 3), vx: rnd(-0.4, 0.4), w: 4, h: rnd(40, 80), gravity: 0.02, vr: rnd(-2, 2) }));
    } else if (type === 'stars') {
      for (let i = 0; i < 90; i++) particles.push(mk({ shape: 'star', x: rnd(0, W), y: rnd(0, H), vy: rnd(-1, -0.3), gravity: 0, size: rnd(4, 8) }));
    } else if (type === 'petals') {
      for (let i = 0; i < 90; i++) particles.push(mk({ shape: 'dot', vy: rnd(0.6, 1.6), vx: rnd(-0.6, 0.6), gravity: 0.01, size: rnd(4, 8) }));
    } else if (type === 'keys') {
      for (let i = 0; i < 50; i++) particles.push(mk({ shape: 'key', vy: rnd(1.5, 3.2), size: rnd(10, 16) }));
    } else if (type === 'houses') {
      for (let i = 0; i < 45; i++) particles.push(mk({ shape: 'house', vy: rnd(1.5, 3), vr: rnd(-2, 2), size: rnd(10, 16) }));
    } else if (type === 'coins') {
      for (let i = 0; i < 60; i++) particles.push(mk({ shape: 'coin', vy: rnd(2, 4), spin: rnd(0, 6), vspin: rnd(0.12, 0.26), color: '#A9862F', size: rnd(6, 10) }));
    } else if (type === 'balloons') {
      for (let i = 0; i < 16; i++) particles.push(mk({ shape: 'balloon', y: H + rnd(0, 200), vy: -rnd(1, 2.2), vx: rnd(-0.3, 0.3), gravity: 0, sway: rnd(0, Math.PI * 2), size: rnd(18, 28) }));
    } else if (type === 'fireworks') {
      for (let b = 0; b < 4; b++) {
        const cx = rnd(W * 0.2, W * 0.8), cy = rnd(H * 0.15, H * 0.45), delay = b * 18;
        for (let i = 0; i < 36; i++) {
          const a = rnd(0, Math.PI * 2), sp = rnd(1.5, 5);
          particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, gravity: 0.04, shape: 'dot', size: rnd(2, 4), color: pick(CELEBRATE_COLORS), delay, born: false });
        }
      }
    } else if (type === 'poppers') {
      for (let side = 0; side < 2; side++) {
        const startX = side === 0 ? 0 : W;
        const dir = side === 0 ? 1 : -1;
        for (let i = 0; i < 65; i++) {
          particles.push({ x: startX, y: H, vx: dir * rnd(2, 7), vy: -rnd(4, 9), gravity: 0.15, shape: 'rect', w: 5, h: 9, rot: rnd(0, 360), vr: rnd(-10, 10), color: pick(CELEBRATE_COLORS) });
        }
      }
    }

    const start = performance.now();
    const duration = type === 'fireworks' ? 2400 : (type === 'balloons' || type === 'stars') ? 3200 : 3000;

    function drawParticle(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.shape === 'rect') {
        ctx.rotate((p.rot || 0) * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-(p.w || p.size) / 2, -(p.h || p.size) / 2, p.w || p.size, p.h || p.size);
      } else if (p.shape === 'dot') {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill();
      } else if (p.shape === 'star') {
        ctx.fillStyle = p.color;
        ctx.rotate((p.rot || 0) * Math.PI / 180);
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a1 = (i * 4 * Math.PI) / 5 - Math.PI / 2;
          const r = i === 0 ? p.size : p.size;
          ctx.lineTo(Math.cos(a1) * p.size, Math.sin(a1) * p.size);
        }
        ctx.closePath(); ctx.fill();
      } else if (p.shape === 'key') {
        ctx.rotate((p.rot || 0) * Math.PI / 180);
        ctx.strokeStyle = p.color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(-p.size * 0.3, 0, p.size * 0.3, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(p.size * 0.7, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.size * 0.5, 0); ctx.lineTo(p.size * 0.5, p.size * 0.25); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.size * 0.7, 0); ctx.lineTo(p.size * 0.7, p.size * 0.25); ctx.stroke();
      } else if (p.shape === 'house') {
        ctx.rotate((p.rot || 0) * Math.PI / 180);
        ctx.strokeStyle = p.color; ctx.lineWidth = 1.5;
        const s = p.size;
        ctx.beginPath(); ctx.moveTo(-s / 2, s / 4); ctx.lineTo(0, -s / 2); ctx.lineTo(s / 2, s / 4); ctx.stroke();
        ctx.strokeRect(-s / 2, s / 4, s, s / 2);
      } else if (p.shape === 'coin') {
        const scaleX = Math.abs(Math.cos(p.spin));
        ctx.scale(scaleX, 1);
        ctx.fillStyle = p.color; ctx.strokeStyle = '#7A5F20'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (p.shape === 'balloon') {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(0, 0, p.size / 2.4, p.size / 1.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = p.color; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, p.size / 1.8); ctx.lineTo(0, p.size / 1.8 + 18); ctx.stroke();
      }
      ctx.restore();
    }

    function frame(t) {
      const elapsed = t - start;
      const fadeStart = duration * 0.72;
      const globalAlpha = elapsed < fadeStart ? 1 : Math.max(0, 1 - (elapsed - fadeStart) / (duration - fadeStart));
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = globalAlpha;
      particles.forEach(p => {
        if (type === 'fireworks') {
          if (elapsed < p.delay) return;
        }
        if (type === 'balloons') {
          p.sway += 0.03;
          p.x += Math.sin(p.sway) * 0.4;
        }
        p.x += p.vx; p.y += p.vy;
        p.vy += (p.gravity || 0);
        if (type === 'fireworks') p.vx *= 0.985, p.vy *= 0.985;
        if (p.vr) p.rot += p.vr;
        if (p.vspin) p.spin += p.vspin;
        drawParticle(p);
      });
      ctx.globalAlpha = 1;
      if (elapsed < duration) requestAnimationFrame(frame);
      else canvas.remove();
    }
    requestAnimationFrame(frame);
  }

  function encodeState(obj) {
    return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(obj)))));
  }
  function decodeState(str) {
    try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(str))))); }
    catch (e) { return null; }
  }
  function goToLease(d) {
    // If we're on a short-link path (/l/<id>), setting only the hash would re-trigger
    // the short-link loader and discard in-progress signatures. Navigate to root instead.
    const target = '#lease=' + encodeState(d);
    if (/^\/l\/[A-Za-z0-9]+\/?$/.test(location.pathname)) {
      location.replace(location.origin + '/' + target);
    } else {
      location.hash = target;
    }
  }

  function baseUrl() {
    // Always build links against the app root — never the /l/<id> short-link path,
    // otherwise a link built while viewing a short link would lose its #lease data.
    if (/^\/l\/[A-Za-z0-9]+\/?$/.test(location.pathname)) return location.origin + '/';
    return location.origin + location.pathname;
  }

  async function loadShortLease(id) {
    app.innerHTML = header(true) + `<p class="hint" style="text-align:center;padding:2rem 0;">Loading your lease&hellip;</p>`;
    try {
      const resp = await fetch('/api/lease?id=' + encodeURIComponent(id));
      if (resp.status === 410) {
        app.innerHTML = header(true) + `<div class="banner banner-brass">This lease link has expired. Please ask your landlord to send a new one.</div>`;
        return;
      }
      if (!resp.ok) throw new Error('not found');
      const text = await resp.text();
      const state = JSON.parse(text);
      window.__currentLeaseId = id;
      renderLeaseView(state);
    } catch (e) {
      app.innerHTML = header(true) + `<div class="banner banner-brass">We couldn't open this lease link. Please ask your landlord to resend it.</div>`;
    }
  }

  function route() {
    // Short link form: /l/<id>
    const pathMatch = location.pathname.match(/^\/l\/([A-Za-z0-9]+)\/?$/);
    if (pathMatch) { loadShortLease(pathMatch[1]); return; }

    const hash = location.hash;
    if (hash.startsWith('#lease=')) {
      const state = decodeState(hash.slice(7));
      if (!state) { renderBadLink(); return; }
      renderLeaseView(state);
      return;
    }
    if (hash.startsWith('#receipt=')) {
      const state = decodeState(hash.slice(9));
      if (!state) { renderBadLink(); return; }
      renderReceiptFinal(state);
      return;
    }
    if (hash === '#/receipt') { if (!landlordAuthed()) { renderGate('#/receipt'); return; } renderReceiptForm(); return; }
    if (hash === '#/new') { if (!landlordAuthed()) { renderGate('#/new'); return; } renderNewLeaseChooser(); return; }
    if (hash === '#/continue') { renderTenantStatus(); return; }
    if (hash === '#/start') { renderTenantIntake(); return; }
    if (hash === '#/staff') { if (!landlordAuthed()) { renderGate('#/staff'); return; } renderStaffMenu(); return; }
    renderHome();
  }

    const entitySelect = document.getElementById('f-entity-select');
    const entityInput = document.getElementById('f-entity');
    function syncEntityFromSelect() {
      if (entitySelect.value === '__other__') {
        entityInput.style.display = '';
        entityInput.required = true;
        if (ENTITIES.includes(entityInput.value)) entityInput.value = '';
      } else {

    const emailSelect = document.getElementById('f-landlordemail-select');
    const emailInput = document.getElementById('f-landlordemail');
    function syncEmailFromSelect() {
      if (emailSelect.value === '__other__') {
        emailInput.style.display = ''; emailInput.required = true;
        if (['TLDRenterprise@gmail.com', 'Gracefulomllc@gmail.com'].includes(emailInput.value)) emailInput.value = '';
      } else {
        emailInput.style.display = 'none'; emailInput.required = false;
        emailInput.value = emailSelect.value;

    }
    emailSelect.addEventListener('change', syncEmailFromSelect);
    syncEmailFromSelect();

    const phoneSelect = document.getElementById('f-landlordphone-select');

      if (phoneSelect.value === '__other__') {
        phoneInput.style.display = '';
        if (phoneInput.value === '7193597502') phoneInput.value = '';
      } else if (phoneSelect.value === '__none__') {
        phoneInput.style.display = 'none'; phoneInput.value = '';
      } else {
        phoneInput.style.display = 'none'; phoneInput.value = phoneSelect.value;
      }
    }
    phoneSelect.addEventListener('change', syncPhoneFromSelect);
    syncPhoneFromSelect();

    document.getElementById('f-property-select').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === '' || val === '__manual__') {
        if (val === '__manual__') document.getElementById('f-address').focus();
        return;
      }
      const match = PROPERTIES[parseInt(val, 10)];
      if (!match) return;
      document.getElementById('f-address').value = match.street;
      document.getElementById('f-unit').value = match.unit || '';
      document.getElementById('f-cityzip').value = match.cityZip;
      if (match.entity) {
        if (ENTITIES.includes(match.entity)) {
          entitySelect.value = match.entity;
        } else {
          entitySelect.value = '__other__';
        }
        syncEntityFromSelect();
        entityInput.value = match.entity;
      }
    });
    document.querySelectorAll('input[name="f-termtype"]').forEach(r => r.addEventListener('change', () => {
      const mtm = document.querySelector('input[name="f-termtype"]:checked').value === 'mtm';
      document.getElementById('end-date-field').style.display = mtm ? 'none' : '';

    document.getElementById('f-supersede').addEventListener('change', (e) => {

    });

    function updatePetRentHint() {
      const on = document.getElementById('f-haspetrent').checked;
      const hint = document.getElementById('petrent-total-hint');
      if (!on) { hint.style.display = 'none'; return; }
      const rent = parseFloat(document.getElementById('f-rent').value) || 0;
      const per = parseFloat(document.getElementById('f-petrentamount').value) || 0;
      const count = parseInt(document.getElementById('f-petcount').value) || 0;
      const petTotal = per * count;
      hint.textContent = 'Total monthly rent with pet rent: ' + fmtMoney(rent + petTotal) + ' (' + fmtMoney(rent) + ' base + ' + fmtMoney(petTotal) + ' pet rent)';
      hint.style.display = '';
    }
    document.getElementById('f-haspetrent').addEventListener('change', (e) => {
      document.getElementById('petrent-fields').style.display = e.target.checked ? '' : 'none';
      updatePetRentHint();
    });
    function prorateCalc() {
      const rent = parseFloat(document.getElementById('f-rent').value) || 0;
      const start = document.getElementById('f-start').value;
      if (!rent || !start) return null;
      const dt = new Date(start + 'T12:00:00');
      const daysInMonth = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
      const remaining = daysInMonth - dt.getDate() + 1;
      if (remaining >= daysInMonth) return null; // moving in on the 1st: no proration
      const amount = Math.round((rent / daysInMonth) * remaining * 100) / 100;
      return { amount, remaining, daysInMonth, periodEnd: new Date(dt.getFullYear(), dt.getMonth() + 1, 0).toISOString().slice(0,10) };
    }
    function refreshProrate() {
      const box = document.getElementById('f-prorate');
      const prev = document.getElementById('prorate-preview');
      if (!box || !prev) return;
      const p = box.checked ? prorateCalc() : null;
      if (box.checked && p) {
        prev.style.display = '';
        prev.textContent = 'Prorated first month: ' + fmtMoney(p.amount) + ' (' + p.remaining + ' of ' + p.daysInMonth + ' days). Full rent starts the 1st of the following month.';
      } else if (box.checked) {
        prev.style.display = '';
        prev.textContent = 'Enter rent and a start date after the 1st to calculate proration.';
      } else {
        prev.style.display = 'none';

    });
    document.getElementById('f-rent').addEventListener('input', refreshProrate);
    ['f-rent','f-petrentamount','f-petcount'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePetRentHint);

    document.getElementById('toggle-tenant2').addEventListener('click', () => {

      btn.textContent = showing ? '+ Add a second tenant' : '\u2212 Remove second tenant';
      if (showing) { document.getElementById('f-tenant2').value = ''; document.getElementById('f-phone2').value = ''; document.getElementById('f-email2').value = ''; }
    });

    const __restoring = !!(window.__restoreDraft && landlordDraft);
    window.__restoreDraft = false;
    let depositRows = (__restoring && Array.isArray(landlordDraft.deposits) && landlordDraft.deposits.length)
      ? JSON.parse(JSON.stringify(landlordDraft.deposits)).map(r => ({ ...r, plan: r.plan || [], down: r.down || '' }))
      : [{ label: 'Security Deposit', amount: '', status: 'due' }];
    function renderDepositRows() {
      const wrap = document.getElementById('deposit-rows');
      wrap.innerHTML = depositRows.map((row, i) => `
        <div class="deposit-row" data-idx="${i}">
          <input type="text" placeholder="Label (e.g. Pet Deposit)" value="${esc(row.label)}" data-field="label">
          <input type="number" min="0" step="1" placeholder="Amount" value="${esc(row.amount)}" data-field="amount">
          <select data-field="status">
            <option value="due" ${row.status==='due'?'selected':''}>Due at signing</option>
            <option value="plan" ${row.status==='plan'?'selected':''}>Payment plan</option>
            <option value="carried" ${row.status==='carried'?'selected':''}>Already held</option>
            <option value="nonrefundable" ${row.status==='nonrefundable'?'selected':''}>Non-refundable fee</option>
          </select>
          <button type="button" class="row-remove" title="Remove" ${depositRows.length===1?'disabled style="visibility:hidden;"':''}>&times;</button>
        </div>
        ${row.status==='plan' ? `
        <div class="plan-editor" data-idx="${i}" style="margin:0 0 0.75rem 0;padding:0.75rem;border:1px dashed var(--line, #c9b89a);border-radius:6px;">
          <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
            <label style="font-size:0.82rem;white-space:nowrap;">Due at signing $</label>
            <input type="number" min="0" step="1" style="max-width:110px;" value="${esc(row.down||'')}" data-plan-down placeholder="0">
            <span style="font-size:0.78rem;opacity:.7;">then installments:</span>
          </div>
          ${(row.plan||[]).map((p, j) => `
            <div style="display:flex;gap:0.5rem;margin-bottom:0.4rem;align-items:center;" data-plan-row="${j}">
              <input type="date" value="${esc(p.date||'')}" data-plan-field="date" style="flex:1;">
              <input type="number" min="0" step="1" placeholder="Amount" value="${esc(p.amount||'')}" data-plan-field="amount" style="max-width:110px;">
              <button type="button" data-plan-remove="${j}" style="background:none;border:none;cursor:pointer;font-size:1rem;">&times;</button>
            </div>`).join('')}
          <button type="button" class="plan-add" style="font-size:0.8rem;">+ Add installment</button>
          <div style="font-size:0.78rem;margin-top:0.4rem;opacity:.75;" class="plan-check"></div>
        </div>` : ''}
      `).join('') + `<div class="deposit-total">Total: ${fmtMoney(depositRows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0))}</div>`;
      // plan editor wiring
      wrap.querySelectorAll('.plan-editor').forEach(ed => {
        const idx = parseInt(ed.dataset.idx, 10);
        const row = depositRows[idx];
        if (!Array.isArray(row.plan)) row.plan = [];
        const refreshCheck = () => {
          const target = parseFloat(row.amount) || 0;
          const scheduled = (parseFloat(row.down)||0) + row.plan.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
          const el = ed.querySelector('.plan-check');
          if (!target) { el.textContent = ''; return; }
          const diff = target - scheduled;
          el.textContent = diff === 0 ? '✓ Schedule covers the full ' + fmtMoney(target)
            : diff > 0 ? 'Scheduled ' + fmtMoney(scheduled) + ' of ' + fmtMoney(target) + ' — ' + fmtMoney(diff) + ' unscheduled'
            : 'Scheduled ' + fmtMoney(scheduled) + ' exceeds the ' + fmtMoney(target) + ' deposit by ' + fmtMoney(-diff);
          el.style.color = diff === 0 ? 'green' : '#8a6d1a';
        };
        const down = ed.querySelector('[data-plan-down]');
        down.addEventListener('input', () => { row.down = down.value; refreshCheck(); });
        ed.querySelectorAll('[data-plan-row]').forEach(pr => {
          const j = parseInt(pr.dataset.planRow, 10);
          pr.querySelectorAll('[data-plan-field]').forEach(inp => {
            inp.addEventListener('input', () => { row.plan[j][inp.dataset.planField] = inp.value; refreshCheck(); });
          });
        });
        ed.querySelectorAll('[data-plan-remove]').forEach(btn => {
          btn.addEventListener('click', () => { row.plan.splice(parseInt(btn.dataset.planRemove,10),1); renderDepositRows(); });
        });
        ed.querySelector('.plan-add').addEventListener('click', () => { row.plan.push({date:'',amount:''}); renderDepositRows(); });
        refreshCheck();

      wrap.querySelectorAll('.deposit-row').forEach(rowEl => {

            if (input.dataset.field === 'status') renderDepositRows();
          });
        });
        const removeBtn = rowEl.querySelector('.row-remove');
        removeBtn.addEventListener('click', () => {
          if (depositRows.length === 1) return;
          depositRows.splice(idx, 1);
          renderDepositRows();
        });
      });

    document.getElementById('lease-form').addEventListener('submit', (e) => {

      if (termType === 'fixed' && !end) { alert('Enter an end date, or switch to month-to-month.'); return; }

  // ---------- PRE-SEND CHECK ----------
  function parseISO(s) { if (!s) return null; const [y, m, dd] = s.split('-').map(Number); return new Date(y, m - 1, dd); }
  function addMonths(dt, n) { const r = new Date(dt.getFullYear(), dt.getMonth() + n, dt.getDate()); if (r.getDate() !== dt.getDate()) r.setDate(0); return r; }
  function sameDay(a, b) { return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function isoOf(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }

  function checkLease(d) {
    const errors = [], warns = [], notes = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const rent = parseFloat(d.rent) || 0;
    const start = parseISO(d.startDate), end = parseISO(d.endDate);
    const isTroy = /troy/i.test(d.propertyAddress || '');

    // Who / where
    if (!d.entity) errors.push('The landlord entity is missing.');
    if (!d.propertyAddress) errors.push('The property address is missing.');
    if (isTroy && !d.unitLabel) warns.push('No unit number. 411 Troy Ave has several units, so add which one.');
    if (/2043/.test(d.propertyAddress || '') && !d.unitLabel) warns.push('No unit. 2043 East 4th Street has Unit A and Unit B, so add which one.');
    if (!d.landlordAddr) warns.push('The landlord notice address is blank. Colorado leases must include it.');
    if (!d.tenantName) errors.push('The tenant name is missing.');
    else if (d.tenantName.trim().split(/\s+/).length < 2) warns.push('"' + d.tenantName + '" looks like only one name. Use their full legal name.');
    const digits = String(d.tenantPhone || '').replace(/\D/g, '');
    if (!digits && !d.tenantEmail) errors.push('There is no tenant phone or email, so there is no way to send the link.');
    if (digits && digits.length < 10) warns.push('The tenant phone has only ' + digits.length + ' digits. Their access code is the last 4, so a wrong number locks them out.');
    if (!digits) warns.push('No tenant phone. They won\'t have a last-4 access code to get back in.');
    if (d.tenantEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.tenantEmail)) warns.push('The tenant email "' + d.tenantEmail + '" doesn\'t look valid.');

    // Dates
    if (!start) errors.push('The start date is missing.');
    if (start && start < today && !d.supersede) warns.push('The start date (' + fmtDate(d.startDate) + ') is in the past.');
    if (start && (start - today) / 86400000 > 90) warns.push('The start date is more than 90 days away (' + fmtDate(d.startDate) + ').');
    if (d.termType !== 'mtm' && start) {
      if (!end) errors.push('The end date is missing.');
      else if (end <= start) errors.push('The end date (' + fmtDate(d.endDate) + ') is on or before the start date.');
      else {
        let months = null;
        for (let n = 1; n <= 36; n++) { const exp = addMonths(start, n); exp.setDate(exp.getDate() - 1); if (sameDay(exp, end)) { months = n; break; } }
        if (months) { notes.push('Term: ' + months + ' month' + (months === 1 ? '' : 's') + ' (' + fmtDate(d.startDate) + ' to ' + fmtDate(d.endDate) + ').'); if (months > 24) warns.push('That is a ' + months + '-month term. Make sure that\'s intended.'); }
        else {
          const twelve = addMonths(start, 12); twelve.setDate(twelve.getDate() - 1);
          warns.push('The end date (' + fmtDate(d.endDate) + ') doesn\'t line up with the start. A 12-month lease starting ' + fmtDate(d.startDate) + ' would end ' + fmtDate(isoOf(twelve)) + '.');
        }
      }
    }
    if (d.supersede && !d.priorTerm) warns.push('"Replaces a prior lease" is checked but the prior term is blank.');

    // Money
    if (rent <= 0) errors.push('Monthly rent is missing or $0.');
    else if (rent < 300 || rent > 5000) warns.push('Rent of ' + fmtMoney(rent) + ' looks unusual. Check for a typo.');
    const due = parseInt(d.dueDay, 10) || 1;
    if (due > 28) warns.push('Rent is due on the ' + due + ordinalSuffix(due) + ', which some months don\'t have.');
    if (start) {
      if (start.getDate() !== 1 && !d.prorateFirst) warns.push('Move-in is on the ' + start.getDate() + ordinalSuffix(start.getDate()) + ' but proration is off. Did you mean to prorate the first month?');
      if (d.prorateFirst && start.getDate() === 1) notes.push('Move-in is on the 1st, so no proration applies.');
      if (d.prorateFirst && start.getDate() !== 1 && !(d.prorate && d.prorate.amount)) errors.push('The proration couldn\'t be calculated. Check the rent and start date.');
    }
    if (isTroy && d.utilMode !== 'included') warns.push('Troy Ave studios include utilities, but Utilities is set to "' + (d.utilMode === 'landlord' ? 'Landlord pays' : 'Tenant pays') + '".');
    if (d.lateFee && !/(seven|\b7\b)/i.test(d.lateFee)) warns.push('The late fee text doesn\'t mention the 7-day grace period Colorado requires.');

    (d.deposits || []).forEach(dep => {
      const amt = parseFloat(dep.amount) || 0;
      const label = dep.label || 'Deposit';
      if (amt <= 0) warns.push(label + ' is $0.');
      if (rent > 0 && amt > rent * 2) warns.push(label + ' of ' + fmtMoney(amt) + ' is more than twice the rent. Check for a typo.');
      if (dep.status === 'plan') {
        const plan = dep.plan || [];
        const scheduled = (parseFloat(dep.down) || 0) + plan.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0);
        if (Math.abs(scheduled - amt) > 0.005) errors.push(label + ' payment plan schedules ' + fmtMoney(scheduled) + ', but the deposit is ' + fmtMoney(amt) + '.');
        plan.forEach(p => {
          const pd = parseISO(p.date);
          if (pd && pd < today) warns.push(label + ' installment of ' + fmtMoney(p.amount) + ' is dated ' + fmtDate(p.date) + ', which is already past.');
          if (pd && end && d.termType !== 'mtm' && pd > end) warns.push(label + ' installment on ' + fmtDate(p.date) + ' falls after the lease ends.');
        });
      }
    });
    return { errors, warns, notes };
  }

  function renderReview(d) {
    const { errors, warns, notes } = checkLease(d);
    const rent = parseFloat(d.rent) || 0;
    const petTotal = d.hasPetRent ? (parseFloat(d.petRentAmount) || 0) * (parseInt(d.petCount, 10) || 0) : 0;
    const firstMonth = (d.prorateFirst && d.prorate && d.prorate.amount) ? d.prorate.amount : rent + petTotal;
    const depAtSigning = (d.deposits || []).reduce((s, dep) => s + (dep.status === 'plan' ? (parseFloat(dep.down) || 0) : dep.status === 'carried' ? 0 : (parseFloat(dep.amount) || 0)), 0);
